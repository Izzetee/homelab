# Extra CoreDNS server block (imported by the pinned CoreDNS as /etc/coredns/custom/*.server). The LAN zone is answered by the
# LAN resolver 192.168.1.79 (Blocky, which forwards the zone to the router); the router itself is the fallback and is asked only when
# the resolver does not answer (not on NXDOMAIN).
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  lan.server: |
    poecki.local:53 {
        errors
        cache 30
        forward . 192.168.1.79 192.168.1.1 {
            policy sequential
        }
    }
