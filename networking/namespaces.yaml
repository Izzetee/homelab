# Namespaces of the platform services that are rolled out in several steps. They exist before their Applications, so every
# object of those Applications can be checked against the cluster with a server-side dry run first.
apiVersion: v1
kind: Namespace
metadata:
  name: external-dns
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
# The identity provider. The public label lets its routes attach to the `tunnel` listener of the gateway (see
# apps/platform/gateway/gateway.yaml); only exact hostnames are allowed there.
apiVersion: v1
kind: Namespace
metadata:
  name: authentik
  labels:
    homelab.io/public: "true"
    pod-security.kubernetes.io/enforce: restricted
---
# Small tools that are reached through the public tunnel. The public label lets their routes attach to the `tunnel` listener of the gateway;
# it is set here and never by the applications' own project.
apiVersion: v1
kind: Namespace
metadata:
  name: excalidraw
  labels:
    homelab.io/public: "true"
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: uptime-kuma
  labels:
    homelab.io/public: "true"
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: n8n
  labels:
    homelab.io/public: "true"
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: open-webui
  labels:
    homelab.io/public: "true"
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: affine
  labels:
    homelab.io/public: "true"
    pod-security.kubernetes.io/enforce: restricted
