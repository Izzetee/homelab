---
- name: Install the packages the cluster nodes need
  ansible.builtin.apt:
    name: [nfs-common, unattended-upgrades]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Keep unattended upgrades on, without automatic reboots
  ansible.builtin.copy:
    dest: "{{ item.dest }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - dest: /etc/apt/apt.conf.d/20auto-upgrades
      content: |
        APT::Periodic::Update-Package-Lists "1";
        APT::Periodic::Unattended-Upgrade "1";
    - dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
      content: |
        Unattended-Upgrade::Automatic-Reboot "false";
  loop_control:
    label: "{{ item.dest }}"

- name: Harden sshd (keys only, one user, no root login)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-k3s-node.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      AllowUsers {{ ansible_user }}
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Raise the inotify limits (many pods, many watches)
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-k3s-inotify.conf
    state: present
    reload: true
  loop:
    - {name: fs.inotify.max_user_instances, value: "512"}
    - {name: fs.inotify.max_user_watches, value: "524288"}

- name: Stop when the container AppArmor profile was rendered for another K3s version
  ansible.builtin.assert:
    that: node_prep_cri_apparmor_k3s_version == k3s_version
    fail_msg: >-
      The profile in roles/node-prep/templates is rendered from the containerd template of K3s
      {{ node_prep_cri_apparmor_k3s_version }}, but k3s_version is {{ k3s_version }}: compare the new containerd template,
      re-render the profile and move node_prep_cri_apparmor_k3s_version (or remove the override once K3s carries the rules).
    quiet: true

- name: The container AppArmor profile, loaded before K3s starts (stacked-label peers allowed)
  ansible.builtin.template:
    src: cri-containerd.apparmor.d.j2
    dest: /etc/apparmor.d/cri-containerd.apparmor.d
    owner: "{{ node_prep_owner }}"
    group: "{{ node_prep_group }}"
    mode: "0644"
    validate: apparmor_parser -Q -K %s
  notify: Replace the container AppArmor profile

- name: Server only, the K3s configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: inventory_hostname in groups['server']

- name: Server only, the Pod Security admission configuration and the restart it needs
  ansible.builtin.import_tasks: psa.yml
