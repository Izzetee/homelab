---
- name: Install the packages the cluster nodes need
  ansible.builtin.apt:
    name: [nfs-common, unattended-upgrades]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Keep unattended upgrades on, without automatic reboots
  ansible.builtin.copy:
    dest: "{{ item.dest }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - dest: /etc/apt/apt.conf.d/20auto-upgrades
      content: |
        APT::Periodic::Update-Package-Lists "1";
        APT::Periodic::Unattended-Upgrade "1";
    - dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
      content: |
        Unattended-Upgrade::Automatic-Reboot "false";
  loop_control:
    label: "{{ item.dest }}"

- name: Harden sshd (keys only, one user, no root login)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-k3s-node.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      AllowUsers {{ ansible_user }}
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Raise the inotify limits (many pods, many watches)
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-k3s-inotify.conf
    state: present
    reload: true
  loop:
    - {name: fs.inotify.max_user_instances, value: "512"}
    - {name: fs.inotify.max_user_watches, value: "524288"}

- name: Server only, the K3s configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: inventory_hostname in groups['server']

- name: Server only, the Pod Security admission configuration and the restart it needs
  ansible.builtin.import_tasks: psa.yml
