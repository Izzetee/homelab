---
# The only Kubernetes Secret this role creates: the seal key of the secret store (the four former bootstrap Secrets are kept by
# ExternalSecrets since the handover). Each key takes its value from an environment variable (`env`) or is a
# fixed non-secret value (`literal`). An entry with `guard: <text>` is never overwritten: when the live Secret exists
# with another value in any key, the role stops with `FAIL <text> differs` before it writes anything; a Secret that cannot be read
# (and is not proven missing) stops it with `FAIL <text> unreadable`.
secret_bootstrap_secrets:
  - namespace: openbao
    name: openbao-seal-key
    guard: seal key
    keys:
      - {key: seal-key, env: OPENBAO_SEAL_KEY}
