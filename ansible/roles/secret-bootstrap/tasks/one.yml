---
- name: "Does the namespace exist"
  ansible.builtin.command:
    argv: [kubectl, get, namespace, "{{ secret_bootstrap_item.namespace }}", --output, name]
  register: secret_bootstrap_ns
  changed_when: false
  failed_when: false
  check_mode: false

- name: "Create the namespace with Pod Security restricted"
  ansible.builtin.command:
    argv: [kubectl, apply, --server-side, --field-manager=secret-bootstrap, --filename, "-"]
    stdin: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: {{ secret_bootstrap_item.namespace }}
        labels:
          pod-security.kubernetes.io/enforce: restricted
  changed_when: true
  when: secret_bootstrap_ns.rc != 0 and not ansible_check_mode

- name: "Read the current Secret (it stays in the registered variable)"
  ansible.builtin.command:
    argv: [kubectl, get, secret, "{{ secret_bootstrap_item.name }}", --namespace, "{{ secret_bootstrap_item.namespace }}", --output, json]
  register: secret_bootstrap_current
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

# A guarded Secret is written only when this read proved it (or its absence): a second failed read must not turn into a write.
- name: "Refuse when a guarded Secret cannot be read and is not proven missing"
  ansible.builtin.fail:
    msg: "FAIL {{ secret_bootstrap_item.guard }} unreadable"
  when:
    - secret_bootstrap_item.guard is defined
    - secret_bootstrap_current.rc != 0
    - (secret_bootstrap_current.stderr | default('')) is not search('NotFound')

- name: Is the Secret missing or different in any key?
  ansible.builtin.set_fact:
    secret_bootstrap_needed: >-
      {%- set have = ((secret_bootstrap_current.stdout | from_json).data | default({})) if secret_bootstrap_current.rc == 0 else {} -%}
      {%- set diff = namespace(any=secret_bootstrap_current.rc != 0) -%}
      {%- for k in secret_bootstrap_item['keys'] -%}
      {%- set want = k.literal if k.literal is defined else lookup('ansible.builtin.env', k.env) -%}
      {%- if k.key not in have or (have[k.key] | b64decode) != want -%}{%- set diff.any = true -%}{%- endif -%}
      {%- endfor -%}
      {{ diff.any }}
  no_log: true

- name: "Report a missing or different Secret"
  ansible.builtin.debug:
    msg: >-
      {{ secret_bootstrap_item.namespace }}/{{ secret_bootstrap_item.name }}
      {{ 'differs or is missing' if secret_bootstrap_needed | bool else 'is current' }}
  changed_when: secret_bootstrap_needed | bool
  when: ansible_check_mode

# A value goes through `printf %s "$NAME"` (a builtin: no argument list) into a process substitution, which kubectl
# reads as a file descriptor; a literal is the fixed non-secret text of the list.
- name: "Create or update the Secret (values on file descriptors)"
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      kubectl create secret generic {{ secret_bootstrap_item.name }} \
        --namespace {{ secret_bootstrap_item.namespace }} \
      {% for k in secret_bootstrap_item['keys'] %}
      {% if k.literal is defined %}
        --from-literal={{ k.key }}={{ k.literal | quote }} \
      {% else %}
        --from-file={{ k.key }}=<(printf %s "${{ '{' }}{{ k.env }}{{ '}' }}") \
      {% endif %}
      {% endfor %}
        --dry-run=client --output yaml \
        | kubectl label --local --filename - homelab.io/bootstrap=true --output yaml \
        | kubectl apply --server-side --field-manager=secret-bootstrap --filename -
    executable: /bin/bash
  changed_when: true
  no_log: true
  when: secret_bootstrap_needed | bool and not ansible_check_mode
