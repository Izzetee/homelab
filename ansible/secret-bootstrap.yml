---
# Creates the bootstrap Secrets in the cluster from environment values (CF_DNS01_TOKEN, CF_TUNNEL_TOKEN,
# GRAFANA_ADMIN_PASSWORD, ALERTMANAGER_DISCORD_WEBHOOK_URL) on the bastion. Run it with the wrapper of the operations
# repository: never with --diff or -v (a diff or a verbose result could print a value).
- name: Bootstrap secrets
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - secret-bootstrap
