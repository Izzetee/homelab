---
# Creates the one bootstrap Secret of the cluster, the seal key of the secret store, from the environment value OPENBAO_SEAL_KEY on
# the bastion (every other Secret is kept by the secret store). Run it with the wrapper of the operations
# repository: never with --diff or -v (a diff or a verbose result could print a value).
- name: Bootstrap secrets
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - secret-bootstrap
