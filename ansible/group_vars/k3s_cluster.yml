---
# Non-secret cluster settings (k3s-ansible variables). The join token is NOT here: see group_vars/agent.yml
# and the k3s-cluster play (token drop-in written by a no_log task).
k3s_version: v1.37.2+k3s1
api_endpoint: 192.168.1.81
# the admin kubeconfig lands on the controller only (owner-only: the wrapper runs with umask 077)
kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/config"
# K3s binary and install script, fetched and checksum-verified on the controller (k3s-cluster.yml) and distributed by the
# collection's airgap path: nothing is downloaded or executed unverified on a node. The binary is the release asset
# (linux/amd64 and linux/arm64, each with its own pin from the release's sha256sum files), the script is install.sh of the release tag.
airgap_dir: "{{ lookup('env', 'HOME') }}/.cache/k3smig/airgap"
k3s_binary_checksum: 265b3ee6a3198ef14033c63ef46cbb32370d83795199fb6d1b01f21575eddbda
k3s_binary_checksum_arm64: a779ccf1e5e2e33a62f5a29c2f1c0bbf99431e100579d4c10f0aa0742a6aa84b
k3s_install_script_checksum: ed01f89fd977bf20ac1516bbebf8370bf3ddbaa55dac8aba610956a4c78cc00b
# the configuration files the k3s_detect role writes (identical to what the collection would write), so a re-run can tell
# "nothing changed" from "install and restart"
k3s_config_dir: /etc/rancher/k3s
# root-only marker: a K3s restart is pending (written before the first write that needs one, removed after a verified restart)
k3s_restart_marker: /var/lib/k3smig/k3s-restart-pending
# K3s bundled images by digest (ansible/k3s-images.lock; the k3s-cluster play asserts pause-image equals the lock)
k3s_pause_image: docker.io/rancher/mirrored-pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4
# server flags: Cilium replaces flannel, kube-proxy, network policy and the service load balancer; CoreDNS, the
# local-path provisioner and metrics-server come from the pinned copies in ansible/files/k3s-addons
# K3s 1.37 stages the packaged add-on gateway-api-crd unless it is disabled; the Gateway API CRDs belong to ArgoCD (apps/platform/gateway-api), so it is
# disabled here (an unknown `disable` name is ignored by older K3s releases).
# The controller manager, scheduler and cloud controller run inside the K3s process and a lost leader lease ends it: 60 s lease and 40 s renew
# deadline (upstream 15 s / 10 s) ride out etcd disk stalls of several seconds. The Cilium operator gets the same in apps/platform/cilium/values.yaml.
server_config_yaml: |
  cluster-init: true
  flannel-backend: none
  disable-network-policy: true
  disable-kube-proxy: true
  disable:
    - servicelb
    - traefik
    - coredns
    - local-storage
    - metrics-server
    - gateway-api-crd
  disable-helm-controller: true
  pause-image: "{{ k3s_pause_image }}"
  secrets-encryption: true
  etcd-snapshot-schedule-cron: "0 */6 * * *"
  etcd-snapshot-retention: 12
  tls-san:
    - 192.168.1.81
  write-kubeconfig-mode: "0600"
  kube-apiserver-arg:
    - admission-control-config-file=/etc/rancher/k3s/psa.yaml
  kube-controller-manager-arg:
    - leader-elect-lease-duration=60s
    - leader-elect-renew-deadline=40s
  kube-scheduler-arg:
    - leader-elect-lease-duration=60s
    - leader-elect-renew-deadline=40s
  kube-cloud-controller-manager-arg:
    - leader-elect-lease-duration=60s
    - leader-elect-renew-deadline=40s
  kubelet-arg:
    - image-gc-high-threshold=75
    - image-gc-low-threshold=65
# image garbage collection starts at 75 % disk use (below the 80 % disk alert; the kubelet default is 85 %) and collects down to 65 %.
# The Raspberry Pi agents override agent_config_yaml (group_vars/pi.yml, host_vars) and keep the kubelet defaults.
agent_config_yaml: |
  pause-image: "{{ k3s_pause_image }}"
  kubelet-arg:
    - image-gc-high-threshold=75
    - image-gc-low-threshold=65
