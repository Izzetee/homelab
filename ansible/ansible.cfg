[defaults]
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
host_key_checking = True
retry_files_enabled = False
# the wrapper run sets ANSIBLE_NO_TARGET_SYSLOG=True and ANSIBLE_DISPLAY_ARGS_TO_STDOUT=False as well;
# never enable verbose or debug output for a play that handles a secret
no_target_syslog = True
display_args_to_stdout = False

[privilege_escalation]
become_method = sudo
