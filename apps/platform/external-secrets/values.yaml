# External Secrets Operator. One image serves the controller, the webhook and the cert controller.
image:
  tag: v2.15.0@sha256:6888f243e5f8f7592c6d7fae2a5547c9e33531441b47b53807b9093b25a00e31
installCRDs: true
metrics:
  # the metrics Service the ServiceMonitor in `monitoring` selects (apps/observability/config/servicemonitors.yaml)
  service:
    enabled: true
rbac:
  # the controller may mint the token of one service account only (openbao-auth.yaml), not of every account
  serviceAccountTokenCreate: false
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi
webhook:
  image:
    tag: v2.15.0@sha256:6888f243e5f8f7592c6d7fae2a5547c9e33531441b47b53807b9093b25a00e31
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
certController:
  image:
    tag: v2.15.0@sha256:6888f243e5f8f7592c6d7fae2a5547c9e33531441b47b53807b9093b25a00e31
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
