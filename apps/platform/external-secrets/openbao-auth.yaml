# The account the secret store logs in with. No pod mounts it: the controller asks the API for a short-lived token of
# this account (TokenRequest) and presents that to the store. The Role lets the controller do that for this one
# account and no other.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-auth
  namespace: external-secrets
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-openbao-auth-token
  namespace: external-secrets
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["openbao-auth"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-openbao-auth-token
  namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-openbao-auth-token
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
