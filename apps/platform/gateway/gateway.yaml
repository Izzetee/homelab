# The LAN gateway of the cluster, on a fixed load balancer address: one listener, `lan` (port 443), serves *.lan.chill-town.de
# with the wildcard certificate; routes for LAN-only names attach to it with `sectionName: lan`. The public routes attach to the
# tunnel gateway (`homelab-tunnel`).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab
  namespace: gateway
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: 192.168.1.3
  infrastructure:
    annotations:
      io.cilium/lb-ipam-ips: 192.168.1.3
  listeners:
    - name: lan
      protocol: HTTPS
      port: 443
      hostname: "*.lan.chill-town.de"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: lan-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
