# The gateway of the cloudflared tunnel: one plain-HTTP listener, reachable only inside the cluster (cluster IP, no
# load-balancer address, no node port). Cilium reads the Service settings of a gateway from its GatewayClass, so this
# gateway has a class and a class config of its own; the class `cilium` and the gateway `homelab` stay as they are.
# The Service type cannot be ClusterIP in this Cilium version: a load-balancer class that nothing implements, without node
# ports, leaves the cluster IP only.
apiVersion: cilium.io/v2alpha1
kind: CiliumGatewayClassConfig
metadata:
  name: tunnel
  namespace: gateway
spec:
  service:
    type: LoadBalancer
    loadBalancerClass: homelab.io/cluster-internal
    allocateLoadBalancerNodePorts: false
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium-tunnel
spec:
  controllerName: io.cilium/gateway-controller
  parametersRef:
    group: cilium.io
    kind: CiliumGatewayClassConfig
    name: tunnel
    namespace: gateway
---
# A gateway without an address is never `Programmed`, so ArgoCD's health check for it is switched off.
# Routes attach to the listener `tunnel` only from a namespace labelled homelab.io/public=true.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab-tunnel
  namespace: gateway
  annotations:
    # the target of the public records external-dns publishes for opted-in routes (never an address)
    external-dns.kubernetes.io/target: 12556e89-5228-476b-8513-086a399abfba.cfargotunnel.com
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  gatewayClassName: cilium-tunnel
  listeners:
    - name: tunnel
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              homelab.io/public: "true"
