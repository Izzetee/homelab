# The gateway of the cloudflared tunnel: one plain-HTTP listener for the public routes. Cilium reads the Service settings of a
# gateway from its GatewayClass, so this gateway has a class and a class config of its own; the class `cilium` and the gateway
# `homelab` stay as they are.
# The Service is of type NodePort: it takes no address from the load-balancer pool (a load-balancer class is not applied by
# this Cilium version), and cloudflared reaches it through its cluster IP.
apiVersion: cilium.io/v2alpha1
kind: CiliumGatewayClassConfig
metadata:
  name: tunnel
  namespace: gateway
spec:
  service:
    type: NodePort
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium-tunnel
spec:
  controllerName: io.cilium/gateway-controller
  parametersRef:
    group: cilium.io
    kind: CiliumGatewayClassConfig
    name: tunnel
    namespace: gateway
---
# A gateway without an address is never `Programmed`, so ArgoCD's health check for it is switched off.
# Routes attach to the listener `tunnel` only from a namespace labelled homelab.io/public=true.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab-tunnel
  namespace: gateway
  annotations:
    # the target of the public records external-dns publishes for opted-in routes (never an address)
    external-dns.kubernetes.io/target: 12556e89-5228-476b-8513-086a399abfba.cfargotunnel.com
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  gatewayClassName: cilium-tunnel
  listeners:
    - name: tunnel
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              homelab.io/public: "true"
