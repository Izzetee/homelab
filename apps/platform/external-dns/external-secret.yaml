# The API token of the DNS provider, read from the store. `Orphan` keeps the Secret if this object is ever deleted, and the
# operator copies the annotations below to the Secret so Argo CD never counts it as out of sync or prunes it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-dns
  namespace: external-dns
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: cloudflare-dns
    creationPolicy: Orphan
  data:
    - secretKey: api-token
      remoteRef:
        key: platform/cloudflare-dns
        property: api-token
