# external-dns (chart external-dns, pinned in the Application). It publishes only HTTPRoutes that opt in with the annotation
# homelab.io/public-dns=true, only CNAME records, outside lan.chill-town.de, and never deletes (upsert-only). Records of other
# owners are left alone: the TXT registry skips every record without its own owner id, and the owner record gets its own name.
# Hostnames come only from the route's spec.hostnames (the hostname annotation is ignored, so a route cannot publish another name).
# The record target comes from the annotation on the Gateway (apps/platform/gateway/gateway.yaml), so no A record can appear.
# The first sync ran with --dry-run (no planned change in its log); the flag is removed now.
image:
  repository: registry.k8s.io/external-dns/external-dns
  tag: v0.23.0@sha256:1854499e2b08cee47c40a08e356bff20dcb192dbcfde8378fc3f900f12cad5a3
provider:
  name: cloudflare
sources:
  - gateway-httproute
policy: upsert-only
registry: txt
txtOwnerId: k3s-homelab
txtPrefix: "extdns-%{record_type}-"
domainFilters:
  - chill-town.de
excludeDomains:
  - lan.chill-town.de
annotationFilter: homelab.io/public-dns=true
managedRecordTypes:
  - CNAME
interval: 5m
extraArgs:
  - --cloudflare-proxied
  - --ignore-hostname-annotation
  # required by the flag above; the name lies outside the domain filter, so it never becomes a record
  - --fqdn-template=noop.invalid
env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-dns
        key: api-token
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
