# Default deny for the namespace (cluster DNS excepted). Garage takes the object API from the gateway, the copy job and the node
# (probes), the object API also from the Penpot backend and frontend, and the admin port from the gateway (the health path), Prometheus and the node. It makes no connection of its own beyond DNS.
# The copy job reaches nothing but the object API of Garage.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: garage
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: garage
  namespace: garage
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: garage
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
            - port: "3903"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: penpot
            app.kubernetes.io/name: penpot-backend
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: penpot
            app.kubernetes.io/name: penpot-frontend
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: garage-backup
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "3903"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
            - port: "3903"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: garage-backup
  namespace: garage
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: garage-backup
  enableDefaultDeny:
    ingress: true
    egress: true
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: garage
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
