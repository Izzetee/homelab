# The cluster's RPC secret and the key pair of the copy job, by reference to the store. `Orphan` keeps the Secret when its
# ExternalSecret goes away; the Argo CD annotations keep the Secret out of sync accounting and out of pruning.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-rpc
  namespace: garage
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: garage-rpc
    creationPolicy: Orphan
  data:
    - secretKey: rpc-secret
      remoteRef:
        key: garage/rpc-secret
        property: rpc-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-backup-s3
  namespace: garage
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: garage-backup-s3
    creationPolicy: Orphan
  data:
    - secretKey: access-key-id
      remoteRef:
        key: garage/backup-s3
        property: access-key-id
    - secretKey: secret-access-key
      remoteRef:
        key: garage/backup-s3
        property: secret-access-key
