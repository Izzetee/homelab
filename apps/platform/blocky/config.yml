# Blocky configuration, the only source of the resolver's behavior. Change it by pull request; the check
# `blocky validate --config config.yml` (pinned release) must pass before the merge. Reference: docs of Blocky v0.36.0.

# Public names go only over DNS-over-TLS to four addresses with their certificate names; the addresses need no bootstrap lookup.
upstreams:
  groups:
    default:
      - tcp-tls:1.1.1.1:853#cloudflare-dns.com
      - tcp-tls:1.0.0.1:853#cloudflare-dns.com
      - tcp-tls:9.9.9.9:853#dns.quad9.net
      - tcp-tls:149.112.112.112:853#dns.quad9.net
  strategy: parallel_best
  timeout: 2s
# The LAN has no IPv6.
connectIPVersion: v4

# Local names. Everything below lan.chill-town.de is answered here with the gateway address (works without the internet).
customDNS:
  customTTL: 5m
  filterUnmappedTypes: true
  mapping:
    lan.chill-town.de: 192.168.1.3

# Zones answered by another resolver. One resolver per zone (several would be asked in parallel and mixed).
# The router holds the local records (its static DNS and the names of its DHCP clients): the zone local (it holds poecki.local), vault.poecki.de and the
# reverse zone go to it, the same answers a client gets when it falls back to the router.
conditional:
  mapping:
    local: 192.168.1.1
    vault.poecki.de: 192.168.1.1
    1.168.192.in-addr.arpa: 192.168.1.1

# Client names in metrics and in the query log come from the router's reverse lookups (addresses when it has no name).
clientLookup:
  upstream: 192.168.1.1

# Query path: custom records -> blocking -> cache -> conditional zones -> upstreams.
blocking:
  denylists:
    # The block lists of the previous resolver (hosts, domain and adblock-style lists). Every downloaded list host is also an exact name in the egress rule of
    # network-policy.yaml.
    ads:
      - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
      - https://raw.githubusercontent.com/RPiList/specials/master/Blocklisten/malware
      - https://raw.githubusercontent.com/RPiList/specials/master/Blocklisten/crypto
      - https://raw.githubusercontent.com/RPiList/specials/master/Blocklisten/Phishing-Angriffe
      - https://big.oisd.nl
      - https://raw.githubusercontent.com/Perflyst/PiHoleBlocklist/master/AmazonFireTV.txt
      - https://raw.githubusercontent.com/Perflyst/PiHoleBlocklist/master/android-tracking.txt
      - https://raw.githubusercontent.com/notracking/hosts-blocklists/master/hostnames.txt
      - https://raw.githubusercontent.com/PolishFiltersTeam/KADhosts/master/KADhosts.txt
      - https://raw.githubusercontent.com/FadeMind/hosts.extras/master/add.Spam/hosts
      - https://adaway.org/hosts.txt
      - https://v.firebog.net/hosts/AdguardDNS.txt
      - https://v.firebog.net/hosts/Admiral.txt
      - https://raw.githubusercontent.com/anudeepND/blacklist/master/adservers.txt
      - https://v.firebog.net/hosts/Easylist.txt
      - https://raw.githubusercontent.com/FadeMind/hosts.extras/master/UncheckyAds/hosts
      - https://raw.githubusercontent.com/bigdargon/hostsVN/master/hosts
      - https://v.firebog.net/hosts/Easyprivacy.txt
      - https://v.firebog.net/hosts/Prigent-Ads.txt
      - https://raw.githubusercontent.com/FadeMind/hosts.extras/master/add.2o7Net/hosts
      - https://raw.githubusercontent.com/crazy-max/WindowsSpyBlocker/master/data/hosts/spy.txt
      - https://hostfiles.frogeye.fr/firstparty-trackers-hosts.txt
      - https://raw.githubusercontent.com/DandelionSprout/adfilt/master/Alternate%20versions%20Anti-Malware%20List/AntiMalwareHosts.txt
      - https://v.firebog.net/hosts/Prigent-Crypto.txt
      - https://raw.githubusercontent.com/FadeMind/hosts.extras/master/add.Risk/hosts
      - https://bitbucket.org/ethanr/dns-blacklists/raw/8575c9f96e5b4a1308f2f12394abd86d0927a4a0/bad_lists/Mandiant_APT1_Report_Appendix_D.txt
      - https://phishing.army/download/phishing_army_blocklist_extended.txt
      - https://gitlab.com/quidsup/notrack-blocklists/raw/master/notrack-malware.txt
      - https://v.firebog.net/hosts/RPiList-Malware.txt
      - https://raw.githubusercontent.com/Spam404/lists/master/main-blacklist.txt
      - https://raw.githubusercontent.com/AssoEchap/stalkerware-indicators/master/generated/hosts
      - https://lists.cyberhost.uk/malware.txt
      - https://v.firebog.net/hosts/static/w3kbl.txt
      - https://raw.githubusercontent.com/nocturnalarchives/BlockLists/refs/heads/master/facebook-trackers.txt
      - https://gitlab.com/quidsup/notrack-blocklists/raw/master/notrack-blocklist.txt
      - https://raw.githubusercontent.com/matomo-org/referrer-spam-blacklist/master/spammers.txt
      - https://raw.githubusercontent.com/sjhgvr/oisd/refs/heads/main/oisd_big.txt
    # A group for clients that get no blocking: the group exists (Blocky refuses a client group that names no list) and holds no entry.
    adblockoff:
      - |
        # no entries
    # A name that exists nowhere: it proves blocking without depending on a download.
    canary:
      - |
        blocky-canary.chill-town.de
  # An allow list wins over the deny lists of its group. Add names, URLs or /regex/ lines below.
  allowlists:
    ads:
      - |
        cdn.optimizely.com
        split.io
        s.shopify.com
        /(\.|^)t\.ly$/
        /(\.|^)www\.bit\.ly$/
        /(\.|^)bit\.ly$/
        /(\.|^)ow\.ly$/
        /(\.|^)tinyurl\.com$/
  # `default` applies to every client without its own key; a client key is an exact address and maps to exactly one group.
  clientGroupsBlock:
    default:
      - ads
      - canary
    192.168.1.27:
      - adblockoff
    192.168.1.41:
      - adblockoff
    192.168.1.217:
      - adblockoff
  blockType: zeroIp
  blockTTL: 1m
  loading:
    # A new pod answers only after its lists are loaded, so a surge pod never serves unblocked; a failed download is logged and the pod still starts.
    strategy: blocking
    refreshPeriod: 4h
    downloads:
      timeout: 60s
      attempts: 3

caching:
  prefetching: true
  maxItemsCount: 100000
  prefetchMaxItemsCount: 10000

# Not enabled (see README): DNS rebinding protection and DNSSEC validation.
rebindingProtection:
  enable: false
dnssec:
  validate: false

# Ports: DNS on 53 (UDP and TCP) and the HTTP port 4000 (metrics, API). No DoH, no DoT listener, no profiler.
ports:
  dns: 53
  http: 4000
prometheus:
  enable: true
  path: /metrics
pprof:
  enable: false

# One JSON line per resolved query on stdout (collected like every pod log). Special-use names are not logged.
# To change what is logged: edit the `fields` line (remove an entry to leave that field out), or set `type: none` for no query log.
queryLog:
  type: console
  fields: [clientIP, clientName, responseReason, responseAnswer, question, duration]
  ignore:
    sudn: true
log:
  level: info
  format: json
  privacy: false
