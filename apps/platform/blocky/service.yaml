# DNS on the LAN: one load balancer address from the pool, UDP and TCP 53 only, no node ports. `Local` keeps the client's own address
# (no source translation) and makes only a node with a ready local pod announce the address.
apiVersion: v1
kind: Service
metadata:
  name: blocky-dns
  namespace: blocky
  labels:
    app.kubernetes.io/name: blocky
  annotations:
    lbipam.cilium.io/ips: "192.168.1.4"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  allocateLoadBalancerNodePorts: false
  selector:
    app.kubernetes.io/name: blocky
  ports:
    - name: dns-udp
      port: 53
      protocol: UDP
      targetPort: dns-udp
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: dns-tcp
---
# The HTTP port (metrics).
apiVersion: v1
kind: Service
metadata:
  name: blocky
  namespace: blocky
  labels:
    app.kubernetes.io/name: blocky
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: blocky
  ports:
    - name: http-metrics
      port: 4000
      targetPort: http-metrics
