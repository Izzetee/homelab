apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - daemonset.yaml
  - service.yaml
  - network-policy.yaml
# The whole configuration is one generated ConfigMap: a changed file gets a new name suffix, so every pod is replaced by the rollout.
configMapGenerator:
  - name: blocky-config
    namespace: blocky
    files:
      - config.yml
