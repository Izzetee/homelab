# The client secret of ArgoCD's sign-in through the identity provider, read from the store. `Orphan` keeps a Secret if its ExternalSecret is
# ever deleted; the operator copies the annotations to the Secret, so Argo CD never counts it as out of sync or prunes it. ArgoCD reads a
# `$secret:key` reference only from a Secret that carries the label below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: argocd-oidc
    creationPolicy: Orphan
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
      data:
        argocd: "{{ .argocd }}"
  data:
    - secretKey: argocd
      remoteRef:
        key: authentik/oidc-clients
        property: argocd
