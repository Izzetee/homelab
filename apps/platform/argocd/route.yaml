# The ArgoCD web UI on the LAN listener of the gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
      sectionName: lan
  hostnames:
    - argocd.lan.chill-town.de
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
