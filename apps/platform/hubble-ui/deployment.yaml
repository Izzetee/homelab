# oauth2-proxy in front of the Hubble UI: sign-in with the identity provider (OIDC client hubble-ui, blueprint in apps/identity/authentik/blueprints), then proxied to the UI's Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: hubble-ui
  labels:
    app.kubernetes.io/name: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy
    spec:
      serviceAccountName: oauth2-proxy
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://auth.lan.chill-town.de/application/o/hubble-ui/
            - --client-id=hubble-ui
            - --redirect-url=https://hubble.lan.chill-town.de/oauth2/callback
            - --upstream=http://hubble-ui.kube-system.svc.cluster.local/
            - --upstream-timeout=1h
            - --http-address=0.0.0.0:4180
            - --email-domain=*
            - --allowed-group=authentik Admins
            - --scope=openid email profile offline_access
            # the address is not used for access; the allowed group decides
            - --insecure-oidc-allow-unverified-email=true
            - --insecure-oidc-skip-nonce=false
            - --code-challenge-method=S256
            - --skip-provider-button=true
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-expire=8h
            # group membership is read again on every refresh; the refresh token is renewed only near its end, so parallel requests share one token
            - --cookie-refresh=5m
            - --silence-ping-logging=true
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
          livenessProbe:
            httpGet:
              path: /ping
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
