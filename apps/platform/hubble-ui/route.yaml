# The Hubble UI is served on the LAN name only, through the HTTPS listener, behind the sign-in proxy. Nothing attaches to the tunnel listener.
# The flow stream is long-lived, so the request timeout is off.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui-lan
  namespace: hubble-ui
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
      sectionName: lan
  hostnames:
    - hubble.lan.chill-town.de
  rules:
    - timeouts:
        request: 0s
      backendRefs:
        - name: oauth2-proxy
          port: 80
