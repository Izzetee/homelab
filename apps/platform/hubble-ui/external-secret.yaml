# The client secret and the cookie secret of the proxy, by reference to the store. `Orphan` keeps the Secret when its ExternalSecret goes
# away; the Argo CD annotations keep the Secret out of sync accounting and out of pruning.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy
  namespace: hubble-ui
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: oauth2-proxy
    creationPolicy: Orphan
    template:
      data:
        client-secret: '{{ .client_secret }}'
        # the proxy takes a cookie secret of 16, 24 or 32 bytes
        cookie-secret: '{{ .cookie_secret | trunc 32 }}'
  data:
    - secretKey: client_secret
      remoteRef:
        key: apps/hubble-ui/oidc
        property: client-secret
    - secretKey: cookie_secret
      remoteRef:
        key: apps/hubble-ui/oidc
        property: cookie-secret
