# The one store of the cluster. Only the namespaces listed under conditions may use it; the same list is kept in
# apps/platform/openbao/config/namespaces.txt and in the policy of the `eso` role. It logs in as the dedicated service
# account of external-secrets and trusts the CA of the in-cluster OpenBao.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  conditions:
    - namespaces:
        - argocd
        - authentik
        - cert-manager
        - cloudflared
        - external-dns
        - monitoring
  provider:
    vault:
      server: https://openbao-active.openbao.svc:8200
      path: secret
      version: v2
      caProvider:
        type: Secret
        name: openbao-ca
        namespace: openbao
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: openbao-auth
            namespace: external-secrets
