# The two former bootstrap Secrets of the platform, now kept by the store. `Orphan` adopts the existing Secret in place (same uid, no
# owner reference, it survives the deletion of its ExternalSecret) and creates it when it is missing. Values live in OpenBao only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-dns01
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: cloudflare-dns01
    creationPolicy: Orphan
  data:
    - secretKey: api-token
      remoteRef:
        key: platform/cloudflare-dns
        property: api-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tunnel-token
  namespace: cloudflared
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: tunnel-token
    creationPolicy: Orphan
  data:
    - secretKey: token
      remoteRef:
        key: cloudflared/tunnel-token
        property: token
