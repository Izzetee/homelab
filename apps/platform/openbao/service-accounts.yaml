# The accounts the store's roles are bound to (config/roles). None is mounted by a pod: the operations tooling asks the API for a
# short-lived token of one of them; only the snapshot job projects a token of its own account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-snapshot
  namespace: openbao
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-writer
  namespace: openbao
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-scan
  namespace: openbao
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-admin
  namespace: openbao
automountServiceAccountToken: false
