# Daily Raft snapshot onto the NFS volume. The job logs in with a projected token of its own account (role `snapshot`, read of the
# snapshot endpoint only), keeps files private (umask 077) and the 14 newest. One run at a time holds a lock on the snapshot volume (a second
# run exits 75 without writing); the set name goes to the termination message; a manual run (pod name contains -manual-) keeps every set.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openbao-snapshots
  namespace: openbao
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-k3s-data
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-snapshot
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-snapshot
    homelab.io/backup: "true"
spec:
  schedule: "15 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      # exit 75 = another run holds the volume lock: fail the Job at once, never start a replacement pod that could write after the lock is free
      podFailurePolicy:
        rules:
          - action: FailJob
            onExitCodes:
              containerName: snapshot
              operator: In
              values: [75]
      template:
        metadata:
          labels:
            app.kubernetes.io/name: openbao-snapshot
            homelab.io/role: openbao-snapshot
        spec:
          restartPolicy: Never
          serviceAccountName: openbao-snapshot
          automountServiceAccountToken: false
          # the NFS export lists the three virtual machine nodes, which are the amd64 ones
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: snapshot
              image: quay.io/openbao/openbao:2.7.3@sha256:ba4b133eb9586630024e71a617e66f37f29cc3534cdd46a6233e098ceded8dc9
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  umask 077
                  exec 9>/snapshots/.partial-lock # the name pull copies skip
                  flock -n 9 || { echo "snapshot: another run holds the lock"; exit 75; }
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  BAO_TOKEN=$(bao write -field=token auth/kubernetes/login role=snapshot jwt=@/var/run/secrets/openbao/token)
                  export BAO_TOKEN
                  bao operator raft snapshot save "/work/openbao-$stamp.snap"
                  bao token revoke -self >/dev/null
                  (cd /work && sha256sum "openbao-$stamp.snap" >"openbao-$stamp.snap.sha256")
                  cp "/work/openbao-$stamp.snap" "/work/openbao-$stamp.snap.sha256" /snapshots/
                  printf %s "openbao-$stamp.snap" >/dev/termination-log
                  cd /snapshots
                  # a manual run (pod name contains -manual-) never removes an older set
                  case "$(cat /etc/hostname)" in
                    *-manual-*) ;;
                    *) ls -1 openbao-*.snap | sort -r | tail -n +15 | while read -r f; do rm -f "$f" "$f.sha256"; done ;;
                  esac
                  echo "snapshot openbao-$stamp.snap written"
              env:
                - name: BAO_ADDR
                  value: https://openbao-active.openbao.svc:8200
                - name: BAO_CACERT
                  value: /tls/ca.crt
                - name: HOME
                  value: /work
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: snapshots
                  mountPath: /snapshots
                - name: work
                  mountPath: /work
                - name: tls
                  mountPath: /tls
                  readOnly: true
                - name: token
                  mountPath: /var/run/secrets/openbao
                  readOnly: true
          volumes:
            - name: snapshots
              persistentVolumeClaim:
                claimName: openbao-snapshots
            - name: work
              emptyDir: {}
            - name: tls
              secret:
                secretName: openbao-tls
                items:
                  - key: ca.crt
                    path: ca.crt
            - name: token
              projected:
                sources:
                  - serviceAccountToken:
                      path: token
                      expirationSeconds: 600
