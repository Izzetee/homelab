# Daily Raft snapshot onto the NFS volume. The job logs in with a projected token of its own account (role `snapshot`, read of the
# snapshot endpoint only), keeps files private (umask 077) and the 14 newest.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openbao-snapshots
  namespace: openbao
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-k3s-data
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-snapshot
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-snapshot
    homelab.io/backup: "true"
spec:
  schedule: "15 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: openbao-snapshot
            homelab.io/role: openbao-snapshot
        spec:
          restartPolicy: Never
          serviceAccountName: openbao-snapshot
          automountServiceAccountToken: false
          # the NFS export lists the three virtual machine nodes, which are the amd64 ones
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: snapshot
              image: quay.io/openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  umask 077
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  BAO_TOKEN=$(bao write -field=token auth/kubernetes/login role=snapshot jwt=@/var/run/secrets/openbao/token)
                  export BAO_TOKEN
                  bao operator raft snapshot save "/work/openbao-$stamp.snap"
                  bao token revoke -self >/dev/null
                  (cd /work && sha256sum "openbao-$stamp.snap" >"openbao-$stamp.snap.sha256")
                  cp "/work/openbao-$stamp.snap" "/work/openbao-$stamp.snap.sha256" /snapshots/
                  cd /snapshots
                  ls -1 openbao-*.snap | sort -r | tail -n +15 | while read -r f; do rm -f "$f" "$f.sha256"; done
                  echo "snapshot openbao-$stamp.snap written"
              env:
                - name: BAO_ADDR
                  value: https://openbao-active.openbao.svc:8200
                - name: BAO_CACERT
                  value: /tls/ca.crt
                - name: HOME
                  value: /work
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: snapshots
                  mountPath: /snapshots
                - name: work
                  mountPath: /work
                - name: tls
                  mountPath: /tls
                  readOnly: true
                - name: token
                  mountPath: /var/run/secrets/openbao
                  readOnly: true
          volumes:
            - name: snapshots
              persistentVolumeClaim:
                claimName: openbao-snapshots
            - name: work
              emptyDir: {}
            - name: tls
              secret:
                secretName: openbao-tls
                items:
                  - key: ca.crt
                    path: ca.crt
            - name: token
              projected:
                sources:
                  - serviceAccountToken:
                      path: token
                      expirationSeconds: 600
