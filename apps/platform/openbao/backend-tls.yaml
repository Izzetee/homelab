# The gateway re-encrypts the leg to the store: it verifies the serving certificate against the store's own CA (the public certificate in
# ca-public.yaml) for the service name the certificate carries.
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: openbao-active
  namespace: openbao
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: openbao-active
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: openbao-ca-public
    hostname: openbao-active.openbao.svc
