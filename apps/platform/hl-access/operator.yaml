apiVersion: v1
kind: ServiceAccount
metadata:
  name: hl-operator
  namespace: hl-access
automountServiceAccountToken: false
---
# Starts a manual run of a backup CronJob: read one CronJob, create one Job. Nothing else.
# The admission policy in operator-policy.yaml admits only an exact copy of the namespace's backup CronJob.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hl-operator
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hl-operator
  namespace: affine
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hl-operator
subjects:
  - kind: ServiceAccount
    name: hl-operator
    namespace: hl-access
---
