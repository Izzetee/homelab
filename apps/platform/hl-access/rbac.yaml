apiVersion: v1
kind: ServiceAccount
metadata:
  name: hl-reader
  namespace: hl-access
automountServiceAccountToken: false
---
# Read-only allowlist: get, list and watch on the listed kinds only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hl-reader
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
      - events
      - namespaces
      - nodes
      - persistentvolumes
      - persistentvolumeclaims
      - serviceaccounts
      - resourcequotas
      - limitranges
      - replicationcontrollers
      - podtemplates
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - statefulsets
      - replicasets
      - controllerrevisions
    verbs: [get, list, watch]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: [get, list, watch]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: [get, list, watch]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: [get, list, watch]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
      - ingresses
      - ingressclasses
      - ipaddresses
      - servicecidrs
    verbs: [get, list, watch]
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: [get, list, watch]
  - apiGroups: ["events.k8s.io"]
    resources:
      - events
    verbs: [get, list, watch]
  - apiGroups: ["coordination.k8s.io"]
    resources:
      - leases
    verbs: [get, list, watch]
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
      - csidrivers
      - csinodes
      - csistoragecapacities
      - volumeattachments
      - volumeattributesclasses
    verbs: [get, list, watch]
  - apiGroups: ["scheduling.k8s.io"]
    resources:
      - priorityclasses
    verbs: [get, list, watch]
  - apiGroups: ["node.k8s.io"]
    resources:
      - runtimeclasses
    verbs: [get, list, watch]
  - apiGroups: ["apiextensions.k8s.io"]
    resources:
      - customresourcedefinitions
    verbs: [get, list, watch]
  - apiGroups: ["apiregistration.k8s.io"]
    resources:
      - apiservices
    verbs: [get, list, watch]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources:
      - validatingwebhookconfigurations
      - mutatingwebhookconfigurations
      - validatingadmissionpolicies
      - validatingadmissionpolicybindings
      - mutatingadmissionpolicies
      - mutatingadmissionpolicybindings
    verbs: [get, list, watch]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs: [get, list, watch]
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - pods
      - nodes
    verbs: [get, list, watch]
  - apiGroups: ["argoproj.io"]
    resources:
      - applications
      - applicationsets
      - appprojects
    verbs: [get, list, watch]
  - apiGroups: ["cilium.io"]
    resources:
      - ciliumcidrgroups
      - ciliumclusterwideenvoyconfigs
      - ciliumclusterwidenetworkpolicies
      - ciliumendpoints
      - ciliumenvoyconfigs
      - ciliumgatewayclassconfigs
      - ciliumidentities
      - ciliuml2announcementpolicies
      - ciliumloadbalancerippools
      - ciliumnetworkpolicies
      - ciliumnodeconfigs
      - ciliumnodes
      - ciliumpodippools
    verbs: [get, list, watch]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - gateways
      - gatewayclasses
      - httproutes
      - grpcroutes
      - tlsroutes
      - tcproutes
      - udproutes
      - referencegrants
      - backendtlspolicies
      - listenersets
    verbs: [get, list, watch]
  - apiGroups: ["cert-manager.io"]
    resources:
      - certificates
      - certificaterequests
      - issuers
      - clusterissuers
    verbs: [get, list, watch]
  - apiGroups: ["external-secrets.io"]
    resources:
      - externalsecrets
      - clusterexternalsecrets
      - secretstores
      - clustersecretstores
      - pushsecrets
      - clusterpushsecrets
    verbs: [get, list, watch]
  - apiGroups: ["postgresql.cnpg.io"]
    resources:
      - backups
      - clusterimagecatalogs
      - clusters
      - databaseroles
      - databases
      - failoverquorums
      - imagecatalogs
      - poolers
      - publications
      - scheduledbackups
      - subscriptions
    verbs: [get, list, watch]
  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - alertmanagerconfigs
      - alertmanagers
      - podmonitors
      - probes
      - prometheusagents
      - prometheuses
      - prometheusrules
      - scrapeconfigs
      - servicemonitors
      - thanosrulers
    verbs: [get, list, watch]
  - apiGroups: ["externaldns.k8s.io"]
    resources:
      - dnsendpoints
      - dnsrecords
    verbs: [get, list, watch]
  - apiGroups: ["k3s.cattle.io"]
    resources:
      - etcdsnapshotfiles
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hl-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hl-reader
subjects:
  - kind: ServiceAccount
    name: hl-reader
    namespace: hl-access
