# Every other namespace: no parameter, so the guarded identities are denied there; requests of other users are skipped by the policy.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: hl-operator-jobs-elsewhere
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  policyName: hl-operator-jobs
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["affine", "authentik", "juraticker", "n8n", "open-webui", "uptime-kuma", "wiki"]
---
# Wherever the mark is missing (the marking policy absent or broken, or a different value): no parameter, so the guarded identities are denied.
# NotIn matches Jobs without the label as well. Requests of other users are skipped by the policy's match condition.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: hl-operator-jobs-untagged
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  policyName: hl-operator-jobs
  validationActions: ["Deny"]
  matchResources:
    objectSelector:
      matchExpressions:
        - key: homelab.io/hl-operator
          operator: NotIn
          values: ["true"]
---
# Marks every Job of the guarded identities (mutating admission runs before validating admission; a value sent by the client is replaced).
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: hl-operator-tag
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  failurePolicy: Fail
  reinvocationPolicy: Never
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["jobs"]
  matchConditions:
    - name: guarded-identities
      expression: >-
        request.userInfo.username == 'system:serviceaccount:hl-access:hl-operator' ||
        (request.userInfo.username == 'system:serviceaccount:hl-access:hl-admin-jit' &&
        !(request.namespace in ['affine', 'juraticker', 'n8n', 'open-webui', 'uptime-kuma', 'wiki']))
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{ metadata: Object.metadata{ labels: {"homelab.io/hl-operator": "true"} } }
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: hl-operator-tag
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  policyName: hl-operator-tag
