apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: juraticker
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ghcr-pull
    creationPolicy: Orphan
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" "izzetee" .token | b64enc }}"}}}'
  data:
    - secretKey: token
      remoteRef:
        key: juraticker/ghcr-pull
        property: token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-config
  namespace: juraticker
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: app-config
    creationPolicy: Orphan
  data:
    - secretKey: AZURE_OPENAI_ENDPOINT
      remoteRef:
        key: juraticker/app-config
        property: AZURE_OPENAI_ENDPOINT
    - secretKey: AZURE_OPENAI_MODEL
      remoteRef:
        key: juraticker/app-config
        property: AZURE_OPENAI_MODEL
    - secretKey: OPENAI_GPT52_KEY
      remoteRef:
        key: juraticker/app-config
        property: OPENAI_GPT52_KEY
    - secretKey: CORS_ORIGINS
      remoteRef:
        key: juraticker/app-config
        property: CORS_ORIGINS
    - secretKey: OIDC_ISSUER
      remoteRef:
        key: juraticker/app-config
        property: OIDC_ISSUER
    - secretKey: OIDC_JWKS_URL
      remoteRef:
        key: juraticker/app-config
        property: OIDC_JWKS_URL
    - secretKey: OIDC_AUTHORITY
      remoteRef:
        key: juraticker/app-config
        property: OIDC_AUTHORITY
