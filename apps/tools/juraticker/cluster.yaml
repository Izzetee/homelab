apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: juraticker-db
  namespace: juraticker
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.16-standard-trixie@sha256:56ff6dee0ae923d9b796fe645f7d39c46e109952dbecdf560db4d2a9c243e02a
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: juraticker
      owner: juraticker
      encoding: UTF8
      localeCollate: en_US.utf8
      localeCType: en_US.utf8
  storage:
    size: 2Gi
    storageClass: local-path-retain
  affinity:
    nodeSelector:
      kubernetes.io/arch: amd64
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
