apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: juraticker
  labels:
    app.kubernetes.io/name: juraticker
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/name: juraticker
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: juraticker
  labels:
    app.kubernetes.io/name: juraticker
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: juraticker
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
