# The PostgreSQL 18 database of the throwaway app: one table, one row. The operator creates the Secret `offboard-test-db-app` and the services
# `offboard-test-db-rw` and `offboard-test-db-r`.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: offboard-test-db
  namespace: offboard-test
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:5827829071060876c4029650c04183e4ee562da3ebb9e88c914d67c8dc8669d6
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: offboard_test
      owner: offboard_test
      encoding: UTF8
      localeCollate: en_US.utf8
      localeCType: en_US.utf8
      postInitApplicationSQL:
        - CREATE TABLE public.offboard_probe (id integer PRIMARY KEY, note text NOT NULL)
        - INSERT INTO public.offboard_probe VALUES (1, 'offboarding drill')
        - ALTER TABLE public.offboard_probe OWNER TO offboard_test
  storage:
    size: 1Gi
    storageClass: local-path-retain
  affinity:
    nodeSelector:
      kubernetes.io/arch: amd64
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
