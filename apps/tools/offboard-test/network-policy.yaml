apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: offboard-test
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
# The page is reached through the gateway's proxy and talks to nothing.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: offboard-test
  namespace: offboard-test
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: offboard-test
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# The seed job reaches the object store only.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: offboard-test-seed
  namespace: offboard-test
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: offboard-test-seed
  enableDefaultDeny:
    ingress: true
    egress: true
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: garage
            app.kubernetes.io/name: garage
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: offboard-test-db
  namespace: offboard-test
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: offboard-test-db
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: offboard-test-pg-dump
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: offboard-test-pg-dump
  namespace: offboard-test
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: offboard-test-pg-dump
  enableDefaultDeny:
    ingress: true
    egress: true
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: offboard-test-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
