# Dump set: pg_dump of the database and its sha256; files 0600; a set not written completely is removed and the job fails. The set name is
# `offboard_test-<UTC>` (the database name and the time stamp).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: offboard-test-pg-dump
  namespace: offboard-test
  labels:
    app.kubernetes.io/name: offboard-test-pg-dump
    homelab.io/backup: "true"
spec:
  schedule: "45 2 * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: offboard-test-pg-dump
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            fsGroup: 26
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dump
              image: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:5827829071060876c4029650c04183e4ee562da3ebb9e88c914d67c8dc8669d6
              command: ["/bin/bash", "-euo", "pipefail", "-c"]
              args:
                - |
                  umask 077
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  cd /backup
                  # a manual run (pod name contains -manual-) never removes an older set: it refuses a set name that already exists and fails unless the directory then holds exactly the earlier entries plus its new set
                  host=$(cat /etc/hostname); manual=0; case "$host" in *-manual-*) manual=1 ;; esac
                  if [ "$manual" = 1 ]; then
                    for f in "offboard_test-$stamp.dump" "offboard_test-$stamp.dump.sha256"; do
                      if [ -e "$f" ] || [ -L "$f" ]; then echo "manual run: $f already exists" >&2; exit 1; fi
                    done
                    before=$(LC_ALL=C ls -1A)
                  fi
                  # any failure below removes this stamp's files
                  ok=0
                  trap '[ "$ok" = 1 ] || rm -f "offboard_test-$stamp.dump" "offboard_test-$stamp.dump.sha256"' EXIT
                  pg_dump -Fc -h offboard-test-db-r -U offboard_test -d offboard_test -f "offboard_test-$stamp.dump"
                  sha256sum "offboard_test-$stamp.dump" >"offboard_test-$stamp.dump.sha256"
                  ok=1
                  if [ "$manual" = 1 ]; then
                    after=$(LC_ALL=C ls -1A)
                    [ "$after" = "$(printf '%s\n' "$before" "offboard_test-$stamp.dump" "offboard_test-$stamp.dump.sha256" | sed '/^$/d' | LC_ALL=C sort)" ] || { echo "manual run: the backup directory is not the earlier entries plus this set" >&2; exit 1; }
                  fi
                  printf %s "offboard_test-$stamp" >/dev/termination-log
                  if [ "$manual" = 0 ]; then
                    ls -1 offboard_test-*.dump | sort -r | tail -n +15 | while read -r f; do b=${f%.dump}; rm -f "$b.dump" "$b.dump.sha256"; done
                  fi
                  echo "set offboard_test-$stamp written"
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: offboard-test-db-app
                      key: password
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: offboard-test-backup
            - name: tmp
              emptyDir: {}
