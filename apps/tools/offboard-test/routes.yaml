# LAN name: the `lan` listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: offboard-test-lan
  namespace: offboard-test
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
      sectionName: lan
  hostnames:
    - offboard-test.lan.chill-town.de
  rules:
    - backendRefs:
        - name: offboard-test
          port: 8080
---
# Public name: the DNS opt-in and the `tunnel` listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: offboard-test
  namespace: offboard-test
  annotations:
    homelab.io/public-dns: "true"
spec:
  parentRefs:
    - name: homelab-tunnel
      namespace: gateway
      sectionName: tunnel
  hostnames:
    - offboard-test.chill-town.de
  rules:
    - backendRefs:
        - name: offboard-test
          port: 8080
