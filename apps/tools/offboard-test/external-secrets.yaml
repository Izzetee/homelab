# The key pair of the app's own Garage bucket, read from the store (keys below apps/offboard-test/). `Orphan` keeps a Secret if its
# ExternalSecret is deleted; the annotations are copied to the Secret (Argo CD compare and prune options).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: offboard-test-s3
  namespace: offboard-test
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: offboard-test-s3
    creationPolicy: Orphan
  data:
    - secretKey: access-key-id
      remoteRef:
        key: apps/offboard-test/s3
        property: access-key-id
    - secretKey: secret-access-key
      remoteRef:
        key: apps/offboard-test/s3
        property: secret-access-key
