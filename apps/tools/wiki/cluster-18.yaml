# The PostgreSQL 18 database of wiki: a new cluster, imported from the frozen PostgreSQL 16 cluster `wiki-db` (CloudNativePG
# `bootstrap.initdb.import`, type microservice: one database, one owner, no roles). The old cluster is not changed; it is the way back
# until the soak after the switch has passed. The operator creates the Secret `wiki-db18-app` and the services `wiki-db18-rw` and `wiki-db18-r`.
# The import connects as the owner with the old cluster's password and CA (verify-full against the `-rw` service name).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: wiki-db18
  namespace: wiki
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:5827829071060876c4029650c04183e4ee562da3ebb9e88c914d67c8dc8669d6
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: wiki
      owner: wiki
      encoding: UTF8
      localeCollate: en_US.utf8
      localeCType: en_US.utf8
      import:
        type: microservice
        databases:
          - wiki
        source:
          externalCluster: wiki-db
  externalClusters:
    - name: wiki-db
      connectionParameters:
        host: wiki-db-rw
        user: wiki
        dbname: wiki
        sslmode: verify-full
      password:
        name: wiki-db-app
        key: password
      sslRootCert:
        name: wiki-db-ca
        key: ca.crt
  storage:
    size: 2Gi
    storageClass: local-path-retain
  affinity:
    nodeSelector:
      kubernetes.io/arch: amd64
      kubernetes.io/hostname: k3s-agent-1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
