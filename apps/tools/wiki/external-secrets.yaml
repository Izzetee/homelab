# The secrets of the wiki, read from the store (only keys below apps/wiki/). `Orphan` keeps a Secret if its ExternalSecret is ever deleted; the
# annotations are copied to the Secret so Argo CD never counts it as out of sync or prunes it. Values live in OpenBao only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: outline-secrets
  namespace: wiki
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: outline-secrets
    creationPolicy: Orphan
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: apps/wiki/outline
        property: SECRET_KEY
    - secretKey: UTILS_SECRET
      remoteRef:
        key: apps/wiki/outline
        property: UTILS_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: outline-oidc
  namespace: wiki
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: outline-oidc
    creationPolicy: Orphan
  data:
    - secretKey: client-secret
      remoteRef:
        key: apps/wiki/oidc
        property: client-secret
