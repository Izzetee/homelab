# Nightly set: a pg_dump of the database, its sha256, the number of documents and a sha256 manifest of the attachment volume (read only here).
# Every file is written 0600 on the dump volume, 14 sets are kept. A copy that the cluster cannot write is pulled from the NAS side.
# The job runs in bash with pipefail; a set whose dump, count or manifest could not be written completely is removed and the job fails.
# It also exits non-zero (set kept, no termination message, no pruning; a hook set is removed) when an attachment name holds a control character or a backslash, or the manifest lists fewer files than were found, so the gap is visible.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wiki-pg-dump
  namespace: wiki
  labels:
    app.kubernetes.io/name: wiki-pg-dump
    homelab.io/backup: "true"
spec:
  schedule: "30 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: wiki-pg-dump
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/arch: amd64
          # the attachment files belong to the wiki's user; this job runs as the same user to read them
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dump
              image: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:5827829071060876c4029650c04183e4ee562da3ebb9e88c914d67c8dc8669d6
              # bash with pipefail: a failing enumeration or hash inside a pipe must fail the job, never leave a short manifest that looks complete
              command: ["/bin/bash", "-euo", "pipefail", "-c"]
              args:
                - |
                  umask 077
                  # scheduled run, manual copy (pod name contains -manual-) or PreSync hook (pod name contains -presync-); one lock on the claim serializes them all
                  host=$(cat /etc/hostname); mode=scheduled
                  case "$host" in *-manual-*) mode=manual ;; *-presync-*) mode=hook ;; esac
                  # a hook refuses to run when its deadline (1800s) plus a margin could reach the reserved window; checked again once the lock is held
                  hook_window() {
                    ws=$(( $(date -u +%s) % 86400 )); we=$((ws + 1800 + 300))
                    if { [ "$ws" -lt 14400 ] && [ "$we" -ge 3600 ]; } || [ "$we" -ge 90000 ]; then echo "hook: refused, the run could overlap the reserved window" >&2; exit 76; fi
                  }
                  [ "$mode" != hook ] || hook_window
                  lk=/backup/.partial-lock
                  # the shared lock file is opened without truncation, and only when it is a plain file (a link or another type is refused before anything is touched)
                  if [ -L "$lk" ] || { [ -e "$lk" ] && [ ! -f "$lk" ]; }; then echo "backup: the lock path is not a plain file" >&2; exit 1; fi
                  exec 9>>"$lk"
                  flock -w 120 9 || { echo "backup: another run holds the lock" >&2; exit 75; }
                  [ "$mode" != hook ] || hook_window
                  out=/backup
                  # the hook's sets live in their own sub-directory, created here only, by the process that holds the lock
                  if [ "$mode" = hook ]; then
                    out=/backup/.presync
                    mkdir -p -m 0700 "$out"
                    { [ -d "$out" ] && [ ! -L "$out" ]; } || { echo "hook: the hook directory is not a plain directory" >&2; exit 1; }
                  fi
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  # no mode overwrites or removes an entry of its set name (a leftover or a link included), whatever the clock says; a manual run also fails unless the directory then holds exactly the earlier entries plus its new set
                  cd "$out"
                  for f in "$stamp.dump" "$stamp.dump.sha256" "$stamp.count" "$stamp.files.sha256"; do
                    if [ -e "$f" ] || [ -L "$f" ]; then echo "$mode run: $f already exists" >&2; exit 1; fi
                  done
                  [ "$mode" != manual ] || before=$(LC_ALL=C ls -1A)
                  # a set is only kept when every file of it was written completely: any failure below removes this stamp's files
                  ok=0
                  trap '[ "$ok" = 1 ] || rm -f "$stamp.dump" "$stamp.dump.sha256" "$stamp.count" "$stamp.files.sha256"' EXIT
                  pg_dump -Fc -h wiki-db18-r -U wiki -d wiki -f "$stamp.dump"
                  sha256sum "$stamp.dump" >"$stamp.dump.sha256"
                  psql -h wiki-db18-r -U wiki -d wiki -At -c 'select count(*) from documents where "deletedAt" is null' >"$stamp.count"
                  list=$(mktemp)
                  (cd /data && find . -type f -print0 | sort -z) >"$list"
                  nfiles=$(tr -cd '\0' <"$list" | wc -c | tr -d ' ')
                  (cd /data && xargs -0 -r sha256sum <"$list") | sed 's|^\([0-9a-f]\{64\}\)  \./|\1  |' >"$stamp.files.sha256"
                  # names as users upload them (spaces, Unicode, quotes) are fine; a control character or a backslash is not (the pull and the restore refuse them too);
                  # a grep that fails is an error, not a count of zero
                  grc=0
                  bad=$(grep -cvE '^[0-9a-f]{64}  [^[:cntrl:]\\]+$' "$stamp.files.sha256") || grc=$?
                  [ "$grc" -le 1 ] || { echo "manifest check failed to run" >&2; exit 1; }
                  lines=$(wc -l <"$stamp.files.sha256" | tr -d ' ')
                  valid=0
                  [ "$bad" = 0 ] && [ "$lines" = "$nfiles" ] && valid=1
                  # a hook set that is not valid is removed again (the trap) before anything else changes; the other modes keep it, so the gap stays visible
                  if [ "$valid" != 1 ] && [ "$mode" = hook ]; then echo "hook: the manifest is not valid (files=$lines listed=$nfiles names-outside-allowlist=$bad)" >&2; exit 1; fi
                  ok=1
                  if [ "$mode" = manual ]; then
                    after=$(LC_ALL=C ls -1A)
                    [ "$after" = "$(printf '%s\n' "$before" "$stamp.dump" "$stamp.dump.sha256" "$stamp.count" "$stamp.files.sha256" | sed '/^$/d' | LC_ALL=C sort)" ] || { echo "manual run: the backup directory is not the earlier entries plus this set" >&2; exit 1; }
                  fi
                  # success termination and pruning only for a valid set
                  if [ "$valid" = 1 ]; then
                    printf %s "$stamp" >/dev/termination-log
                    if [ "$mode" != manual ]; then
                      ls -1 *.dump | sort -r | tail -n +15 | while read -r f; do b=${f%.dump}; rm -f "$b.dump" "$b.dump.sha256" "$b.count" "$b.files.sha256"; done
                    fi
                  fi
                  echo "set $stamp written: files=$lines listed=$nfiles names-outside-allowlist=$bad"
                  [ "$valid" = 1 ]
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: wiki-db18-app
                      key: password
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: wiki-backup
            - name: data
              persistentVolumeClaim:
                claimName: wiki-data
            - name: tmp
              emptyDir: {}
