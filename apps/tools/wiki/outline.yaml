apiVersion: apps/v1
kind: Deployment
metadata:
  name: outline
  namespace: wiki
  labels:
    app.kubernetes.io/name: outline
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: outline
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outline
    spec:
      automountServiceAccountToken: false
      # the attachment volume is an NFS export that only the VM nodes (amd64) reach
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: outline
          image: docker.io/outlinewiki/outline:1.12.0@sha256:25d6a2ced2f1f0cf03c09abd776d87ba31941ed96d3a99992aa84b3bd0afc074
          env:
            - name: HOME
              value: /tmp
            - name: URL
              value: https://wiki.lan.chill-town.de
            - name: PORT
              value: "3000"
            # TLS ends at the gateway's `lan` listener (443 only) and the pod is reached only through it; the proxy headers (trusted by default)
            # keep the session cookie `Secure`
            - name: FORCE_HTTPS
              value: "false"
            - name: PROXY_HEADERS_TRUSTED
              value: "true"
            - name: WEB_CONCURRENCY
              value: "1"
            - name: ENABLE_UPDATES
              value: "false"
            - name: FILE_STORAGE
              value: local
            - name: FILE_STORAGE_LOCAL_ROOT_DIR
              value: /var/lib/outline/data
            - name: FILE_STORAGE_UPLOAD_MAX_SIZE
              value: "26214400"
            - name: REDIS_URL
              value: redis://redis:6379
            - name: OIDC_ISSUER_URL
              value: https://auth.lan.chill-town.de/application/o/outline/
            - name: OIDC_CLIENT_ID
              value: outline
            - name: OIDC_DISPLAY_NAME
              value: Authentik
            - name: OIDC_SCOPES
              value: openid profile email
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: outline-oidc
                  key: client-secret
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: outline-secrets
                  key: SECRET_KEY
            - name: UTILS_SECRET
              valueFrom:
                secretKeyRef:
                  name: outline-secrets
                  key: UTILS_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wiki-db-app
                  key: uri
          ports:
            - name: http
              containerPort: 3000
          # the migrations run at start (the first start takes a while)
          startupProbe:
            httpGet:
              path: /_health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /_health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_health
              port: http
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/outline/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wiki-data
        - name: tmp
          emptyDir: {}
