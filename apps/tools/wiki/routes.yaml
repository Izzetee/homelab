# LAN only: the `lan` listener, no tunnel route and no DNS annotation.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wiki
  namespace: wiki
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
      sectionName: lan
  hostnames:
    - wiki.lan.chill-town.de
  rules:
    - timeouts:
        request: 0s
      backendRefs:
        - name: outline
          port: 3000
