# Uploads the SBOM reports of the Trivy Operator to Dependency-Track on the schedule below; a missed run is skipped.
# The script comes from sbom-upload.py; it prints counts only and puts them in the termination message. Read access to the reports
# comes from the ClusterRole `dependency-track-sbom-reader` (apps/platform/trivy-operator).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sbom-upload
  namespace: dependency-track
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sbom-upload
  namespace: dependency-track
spec:
  schedule: "20 0,4-23 * * *"
  timeZone: Etc/UTC
  suspend: true
  startingDeadlineSeconds: 600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: sbom-upload
        spec:
          restartPolicy: Never
          serviceAccountName: sbom-upload
          automountServiceAccountToken: true
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: upload
              image: docker.io/library/python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
              command: ["python3", "/scripts/sbom-upload.py"]
              env:
                - name: DT_URL
                  value: http://dependency-track-api-server.dependency-track.svc:8080
                - name: DT_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: sbom-upload
                      key: api-key
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: sbom-upload-script
            - name: tmp
              emptyDir: {}
