# Dump set: pg_dump of the database, its sha256 and two counts; files 0600; a set not written completely is removed and the job fails.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dependency-track-pg-dump
  namespace: dependency-track
  labels:
    app.kubernetes.io/name: dependency-track-pg-dump
    homelab.io/backup: "true"
spec:
  schedule: "5 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: dependency-track-pg-dump
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            fsGroup: 26
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dump
              image: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:5827829071060876c4029650c04183e4ee562da3ebb9e88c914d67c8dc8669d6
              command: ["/bin/bash", "-euo", "pipefail", "-c"]
              args:
                - |
                  umask 077
                  # scheduled run, manual copy (pod name contains -manual-) or PreSync hook (pod name contains -presync-); one lock on the claim serializes them all
                  host=$(cat /etc/hostname); mode=scheduled
                  case "$host" in *-manual-*) mode=manual ;; *-presync-*) mode=hook ;; esac
                  # a hook refuses to run when its deadline (1800s) plus a margin could overlap a blocked time of day; checked again once the lock is held
                  hook_window() {
                    ws=$(( $(date -u +%s) % 86400 )); we=$((ws + 1800 + 300))
                    if { [ "$ws" -lt 14400 ] && [ "$we" -ge 3600 ]; } || [ "$we" -ge 90000 ]; then echo "hook: refused, the run could overlap a blocked time of day" >&2; exit 76; fi
                  }
                  [ "$mode" != hook ] || hook_window
                  lk=/backup/.partial-lock
                  # the shared lock file is opened without truncation, and only when it is a plain file (a link or another type is refused before anything is touched)
                  if [ -L "$lk" ] || { [ -e "$lk" ] && [ ! -f "$lk" ]; }; then echo "backup: the lock path is not a plain file" >&2; exit 1; fi
                  exec 9>>"$lk"
                  flock -w 120 9 || { echo "backup: another run holds the lock" >&2; exit 75; }
                  [ "$mode" != hook ] || hook_window
                  out=/backup
                  # the hook's sets live in their own sub-directory, created here only, by the process that holds the lock
                  if [ "$mode" = hook ]; then
                    out=/backup/.presync
                    mkdir -p -m 0700 "$out"
                    { [ -d "$out" ] && [ ! -L "$out" ]; } || { echo "hook: the hook directory is not a plain directory" >&2; exit 1; }
                  fi
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  cd "$out"
                  # no mode overwrites or removes an entry of its set name (a leftover or a link included), whatever the clock says
                  for f in "dtrack-$stamp.dump" "dtrack-$stamp.dump.sha256" "dtrack-$stamp.count"; do
                    if [ -e "$out/$f" ] || [ -L "$out/$f" ]; then echo "$mode run: $f already exists" >&2; exit 1; fi
                  done
                  # a manual run never removes an older set: it fails unless the directory then holds exactly the earlier entries plus its new set
                  if [ "$mode" = manual ]; then before=$(LC_ALL=C ls -1A); fi
                  # any failure below removes this stamp's files
                  ok=0
                  trap '[ "$ok" = 1 ] || rm -f "dtrack-$stamp.dump" "dtrack-$stamp.dump.sha256" "dtrack-$stamp.count"' EXIT
                  pg_dump -Fc -h dependency-track-db-r -U dtrack -d dtrack -f "dtrack-$stamp.dump"
                  sha256sum "dtrack-$stamp.dump" >"dtrack-$stamp.dump.sha256"
                  psql -h dependency-track-db-r -U dtrack -d dtrack -At -c 'select count(*) from "PROJECT" where "INACTIVE_SINCE" is null' >"dtrack-$stamp.count"
                  ok=1
                  if [ "$mode" = manual ]; then
                    after=$(LC_ALL=C ls -1A)
                    [ "$after" = "$(printf '%s\n' "$before" "dtrack-$stamp.dump" "dtrack-$stamp.dump.sha256" "dtrack-$stamp.count" | sed '/^$/d' | LC_ALL=C sort)" ] || { echo "manual run: the backup directory is not the earlier entries plus this set" >&2; exit 1; }
                  fi
                  printf %s "dtrack-$stamp" >/dev/termination-log
                  # pruning is skipped for a manual run
                  case "$mode" in
                    manual) ;;
                    *) ls -1 dtrack-*.dump | sort -r | tail -n +15 | while read -r f; do b=${f%.dump}; rm -f "$b.dump" "$b.dump.sha256" "$b.count"; done ;;
                  esac
                  echo "set dtrack-$stamp written"
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: dependency-track-db-app
                      key: password
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: dependency-track-backup
            - name: tmp
              emptyDir: {}
