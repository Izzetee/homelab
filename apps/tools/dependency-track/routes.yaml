# LAN only: the `lan` listener, no public name. `/api` goes to the API server, everything else to the frontend.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dependency-track-lan
  namespace: dependency-track
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
      sectionName: lan
  hostnames:
    - dependency-track.lan.chill-town.de
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: dependency-track-api-server
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: dependency-track-frontend
          port: 8080
