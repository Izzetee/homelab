# Source: dependency-track/templates/api-server/deployment-web.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dependency-track-api-server
  namespace: dependency-track
  labels:
    helm.sh/chart: dependency-track-2.10.0
    app.kubernetes.io/part-of: dependency-track
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: dependency-track
    app.kubernetes.io/name: dependency-track-api-server
    app.kubernetes.io/component: api-server
    dependencytrack.io/role: web
    app.kubernetes.io/version: 5.2.2
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/instance: dependency-track
      app.kubernetes.io/name: dependency-track-api-server
      app.kubernetes.io/component: api-server
      dependencytrack.io/role: web
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: dependency-track
        app.kubernetes.io/name: dependency-track-api-server
        app.kubernetes.io/component: api-server
        dependencytrack.io/role: web
    spec:
      serviceAccountName: dependency-track
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 1000
      containers:
        - name: api-server
          image: docker.io/dependencytrack/apiserver:5.2.2@sha256:cd5bed12ff30fd36980dbee2d6c3b177c37b99c63b60f5a5b15fbca0b31d0f38
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 2Gi
          env:
            - name: DT_METRICS_ENABLED
              value: "true"
            - name: DT_MANAGEMENT_PORT
              value: "9000"
            - name: DT_DATASOURCE_URL
              value: "jdbc:postgresql://dependency-track-db-rw:5432/dtrack?reWriteBatchedInserts=true"
            - name: DT_DATASOURCE_USERNAME
              value: "${file::/etc/dt/secrets/db/username}"
            - name: DT_DATASOURCE_PASSWORD
              value: "${file::/etc/dt/secrets/db/password}"
            - name: DT_SECRET_MANAGEMENT_PROVIDER
              value: "env"
            - name: DT_FILE_STORAGE_PROVIDER
              value: "local"
            - name: DT_FILE_STORAGE_LOCAL_DIRECTORY
              value: "/data"
            - name: DT_OIDC_ENABLED
              value: "true"
            - name: DT_OIDC_ISSUER
              value: https://auth.lan.chill-town.de/application/o/dependency-track/
            - name: DT_OIDC_CLIENT_ID
              value: dependency-track
            - name: DT_OIDC_USERNAME_CLAIM
              value: preferred_username
            - name: DT_OIDC_USER_PROVISIONING
              value: "true"
            - name: DT_OIDC_TEAM_SYNCHRONIZATION
              value: "true"
            - name: DT_OIDC_TEAMS_CLAIM
              value: groups
            - name: DT_TELEMETRY_SUBMISSION_DEFAULT_ENABLED
              value: "false"
          ports:
            - name: web
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 9000
              protocol: TCP
          livenessProbe:
            httpGet:
              scheme: HTTP
              port: management
              path: /health/live
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              scheme: HTTP
              port: management
              path: /health/ready
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              scheme: HTTP
              port: management
              path: /health/started
            failureThreshold: 60
            initialDelaySeconds: 10
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: db-secret
              mountPath: /etc/dt/secrets/db
              readOnly: true
            
            - name: file-storage
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: db-secret
          secret:
            secretName: dependency-track-db-app
            defaultMode: 0444
            items:
              - key: username
                path: username
              - key: password
                path: password
        
        - name: file-storage
          persistentVolumeClaim:
            claimName: dependency-track-storage
      nodeSelector:
        kubernetes.io/arch: amd64

