apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: open-webui
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-terminal-home
  namespace: open-webui
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-k3s-data
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-terminal-mysql-home
  namespace: open-webui
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-k3s-data
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-backup
  namespace: open-webui
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-k3s-data
  resources:
    requests:
      storage: 5Gi
