---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-terminal-mysql-db
  namespace: open-webui
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: open-terminal-mysql-db
    creationPolicy: Orphan
  data:
    - secretKey: db-host
      remoteRef:
        key: open-webui/open-terminal-mysql-db
        property: db-host
    - secretKey: db-name
      remoteRef:
        key: open-webui/open-terminal-mysql-db
        property: db-name
    - secretKey: db-user
      remoteRef:
        key: open-webui/open-terminal-mysql-db
        property: db-user
    - secretKey: db-pass
      remoteRef:
        key: open-webui/open-terminal-mysql-db
        property: db-pass
