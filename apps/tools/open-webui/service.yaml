apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: open-webui
  labels:
    app.kubernetes.io/name: open-webui
spec:
  selector:
    app.kubernetes.io/name: open-webui
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: open-terminal
  namespace: open-webui
  labels:
    app.kubernetes.io/name: open-terminal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: open-terminal
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: open-terminal-mysql
  namespace: open-webui
  labels:
    app.kubernetes.io/name: open-terminal-mysql
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: open-terminal-mysql
  ports:
    - name: http
      port: 8000
      targetPort: http
