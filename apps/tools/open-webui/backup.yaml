apiVersion: batch/v1
kind: CronJob
metadata:
  name: open-webui-backup
  namespace: open-webui
  labels:
    app.kubernetes.io/name: open-webui-backup
    homelab.io/backup: "true"
spec:
  schedule: "45 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: open-webui-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: docker.io/library/python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
              command: ["python3", "-I", "-c"]
              args:
                - |
                  import atexit, fcntl, glob, gzip, hashlib, os, shutil, sqlite3, stat, sys, tarfile, time
                  NAME, DATA, STAGE, OUT = "open-webui", "/data", "/stage", "/backup"
                  os.umask(0o077)
                  # scheduled run, manual copy (pod name contains -manual-) or PreSync hook (pod name contains -presync-); one lock on the claim serializes them all
                  host = open("/etc/hostname").read()
                  mode = "manual" if "-manual-" in host else "hook" if "-presync-" in host else "scheduled"


                  def hook_window():
                      # a hook refuses to run when its deadline (3600s) plus a margin could reach the reserved window; checked again once the lock is held
                      s = int(time.time()) % 86400
                      end = s + 3600 + 300
                      if (s < 14400 and end >= 3600) or end >= 90000:
                          print("hook: refused, the run could overlap the reserved window", file=sys.stderr)
                          raise SystemExit(76)


                  if mode == "hook":
                      hook_window()
                  # the shared lock file is opened without truncation, and only when it is a plain file (a link or another type is refused)
                  lock = os.open(f"{OUT}/.partial-lock", os.O_RDWR | os.O_CREAT | os.O_NOFOLLOW, 0o600)
                  if not stat.S_ISREG(os.fstat(lock).st_mode):
                      raise SystemExit("backup: the lock path is not a plain file")
                  give_up = time.monotonic() + 120
                  while True:
                      try:
                          fcntl.flock(lock, fcntl.LOCK_EX | fcntl.LOCK_NB)
                          break
                      except BlockingIOError:
                          if time.monotonic() >= give_up:
                              print("backup: another run holds the lock", file=sys.stderr)
                              raise SystemExit(75)
                          time.sleep(1)
                  if mode == "hook":
                      hook_window()
                      # the hook's sets live in their own sub-directory, created here only, by the process that holds the lock
                      OUT += "/.presync"
                      os.makedirs(OUT, mode=0o700, exist_ok=True)
                      if os.path.islink(OUT) or not os.path.isdir(OUT):
                          raise SystemExit("hook: the hook directory is not a plain directory")
                  base = f"{NAME}-{time.strftime('%Y%m%dT%H%M%SZ', time.gmtime())}"

                  def online_copy(src_path, dst_path):
                      src = sqlite3.connect(f"file:{src_path}?mode=ro", uri=True)
                      dst = sqlite3.connect(dst_path)
                      src.backup(dst)
                      dst.close()
                      src.close()
                      chk = sqlite3.connect(dst_path)
                      if chk.execute("pragma integrity_check").fetchone()[0] != "ok":
                          raise SystemExit("integrity check of a copy failed")
                      chk.close()

                  tmp = f"{OUT}/.{base}.db"
                  # no mode overwrites or removes an entry of its set name (a leftover or a link included), whatever the clock says; a manual run also fails unless the directory then holds exactly the earlier entries plus its new set
                  manual = mode == "manual"
                  new = {f"{base}.{e}" for e in ("db.gz", "tar.gz", "db.gz.sha256", "tar.gz.sha256")}
                  mine = sorted(new | {f".{base}.db{x}" for x in ("", "-journal", "-wal", "-shm")})
                  for name in mine:
                      if os.path.lexists(f"{OUT}/{name}"):
                          raise SystemExit(f"{mode} run: a file of this set name already exists")
                  if manual:
                      before = set(os.listdir(OUT))
                  # a failed run removes the files it made itself (the names above were free), so a partial set never counts as one
                  complete = False


                  def cleanup():
                      if not complete:
                          for name in mine:
                              if os.path.lexists(f"{OUT}/{name}"):
                                  os.remove(f"{OUT}/{name}")


                  atexit.register(cleanup)
                  online_copy(f"{DATA}/webui.db", tmp)
                  with open(tmp, "rb") as f, gzip.open(f"{OUT}/{base}.db.gz", "wb") as g:
                      shutil.copyfileobj(f, g)
                  os.remove(tmp)
                  os.makedirs(f"{STAGE}/vector_db")
                  online_copy(f"{DATA}/vector_db/chroma.sqlite3", f"{STAGE}/vector_db/chroma.sqlite3")
                  skip = {"webui.db", "webui.db-wal", "webui.db-shm", "webui.db-journal"}
                  skip_chroma = {"vector_db/chroma.sqlite3", "vector_db/chroma.sqlite3-wal", "vector_db/chroma.sqlite3-shm", "vector_db/chroma.sqlite3-journal"}
                  with tarfile.open(f"{OUT}/{base}.tar.gz", "w:gz") as t:
                      t.add(f"{STAGE}/vector_db/chroma.sqlite3", arcname="vector_db/chroma.sqlite3")
                      for root, dirs, files in os.walk(DATA):
                          rel_root = os.path.relpath(root, DATA)
                          if rel_root == ".":
                              dirs[:] = [d for d in dirs if d != "cache"]
                          for name in files:
                              rel = name if rel_root == "." else f"{rel_root}/{name}"
                              if rel in skip or rel in skip_chroma:
                                  continue
                              t.add(os.path.join(root, name), arcname=rel, recursive=False)
                  # both checksums are written before anything is pruned or reported
                  for ext in ("db.gz", "tar.gz"):
                      path = f"{OUT}/{base}.{ext}"
                      h = hashlib.sha256()
                      with open(path, "rb") as f:
                          for chunk in iter(lambda: f.read(1 << 20), b""):
                              h.update(chunk)
                      with open(path + ".sha256", "w") as f:
                          f.write(f"{h.hexdigest()}  {base}.{ext}\n")
                  if manual and set(os.listdir(OUT)) != before | new:
                      raise SystemExit("manual run: the backup directory is not the earlier entries plus this set")
                  open("/dev/termination-log", "w").write(base)
                  complete = True
                  if not manual:
                      for ext in ("db.gz", "tar.gz"):
                          for old in sorted(glob.glob(f"{OUT}/{NAME}-*.{ext}"))[:-14]:
                              os.remove(old)
                              if os.path.exists(old + ".sha256"):
                                  os.remove(old + ".sha256")
                  print(f"backup {base} written")
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: backup
                  mountPath: /backup
                - name: stage
                  mountPath: /stage
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: open-webui-data
                readOnly: true
            - name: backup
              persistentVolumeClaim:
                claimName: open-webui-backup
            - name: stage
              emptyDir: {}
            - name: tmp
              emptyDir: {}
