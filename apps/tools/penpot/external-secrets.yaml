# The secrets of Penpot, read from the store (keys below apps/penpot/). `Orphan` keeps a Secret if its ExternalSecret is deleted; the
# annotations are copied to the Secret (Argo CD compare and prune options).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: penpot-oidc
  namespace: penpot
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: penpot-oidc
    creationPolicy: Orphan
  data:
    - secretKey: client-secret
      remoteRef:
        key: apps/penpot/oidc
        property: client-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: penpot-app
  namespace: penpot
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: penpot-app
    creationPolicy: Orphan
  data:
