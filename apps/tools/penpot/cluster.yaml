# The PostgreSQL 18 database of Penpot. The operator creates the Secret `penpot-db-app` and the services `penpot-db-rw` and `penpot-db-r`.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: penpot-db
  namespace: penpot
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:5827829071060876c4029650c04183e4ee562da3ebb9e88c914d67c8dc8669d6
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: penpot
      owner: penpot
      encoding: UTF8
      localeCollate: en_US.utf8
      localeCType: en_US.utf8
  storage:
    size: 5Gi
    storageClass: local-path-retain
  affinity:
    nodeSelector:
      kubernetes.io/arch: amd64
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
