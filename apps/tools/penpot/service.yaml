apiVersion: v1
kind: Service
metadata:
  name: penpot-frontend
  namespace: penpot
  labels:
    app.kubernetes.io/name: penpot-frontend
    app.kubernetes.io/part-of: penpot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: penpot-frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: penpot-backend
  namespace: penpot
  labels:
    app.kubernetes.io/name: penpot-backend
    app.kubernetes.io/part-of: penpot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: penpot-backend
  ports:
    - name: http
      port: 6060
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: penpot-exporter
  namespace: penpot
  labels:
    app.kubernetes.io/name: penpot-exporter
    app.kubernetes.io/part-of: penpot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: penpot-exporter
  ports:
    - name: http
      port: 6061
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: penpot-valkey
  namespace: penpot
  labels:
    app.kubernetes.io/name: penpot-valkey
    app.kubernetes.io/part-of: penpot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: penpot-valkey
  ports:
    - name: redis
      port: 6379
      targetPort: redis
