apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-lan
  namespace: agentgateway
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
      sectionName: lan
  hostnames:
    - llm.lan.chill-town.de
  rules:
    - timeouts:
        request: 0s
      backendRefs:
        - name: agentgateway
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-ui-lan
  namespace: agentgateway
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
      sectionName: lan
  hostnames:
    - agw.lan.chill-town.de
  rules:
    - timeouts:
        request: 0s
      backendRefs:
        - name: agentgateway
          port: 15080
