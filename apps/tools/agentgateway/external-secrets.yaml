apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: azure-provider
  namespace: agentgateway
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: azure-provider
    creationPolicy: Orphan
    template:
      mergePolicy: Merge
      data:
        AZURE_BASE_URL: '{{ .AZURE_OPENAI_ENDPOINT | trimSuffix "/" | trimSuffix "/openai/v1" | trimSuffix "/" }}/openai/v1'
  data:
    - secretKey: OPENAI_GPT52_KEY
      remoteRef:
        key: juraticker/app-config
        property: OPENAI_GPT52_KEY
    - secretKey: AZURE_OPENAI_ENDPOINT
      remoteRef:
        key: juraticker/app-config
        property: AZURE_OPENAI_ENDPOINT
    - secretKey: AZURE_OPENAI_MODEL
      remoteRef:
        key: juraticker/app-config
        property: AZURE_OPENAI_MODEL
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: virtual-key-hashes
  namespace: agentgateway
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: virtual-key-hashes
    creationPolicy: Orphan
    template:
      data:
        AGW_HASH_JURATICKER: 'sha256:{{ .juraticker | sha256sum }}'
        AGW_HASH_OPEN_WEBUI: 'sha256:{{ .open_webui | sha256sum }}'
        AGW_HASH_MAC: 'sha256:{{ .mac | sha256sum }}'
  data:
    - secretKey: juraticker
      remoteRef:
        key: agentgateway/virtual-keys
        property: juraticker
    - secretKey: open_webui
      remoteRef:
        key: agentgateway/virtual-keys
        property: open-webui
    - secretKey: mac
      remoteRef:
        key: agentgateway/virtual-keys
        property: mac
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ui-oidc
  namespace: agentgateway
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ui-oidc
    creationPolicy: Orphan
  data:
    - secretKey: client-secret
      remoteRef:
        key: agentgateway/ui-oidc
        property: client-secret
    - secretKey: cookie-secret
      remoteRef:
        key: agentgateway/ui-oidc
        property: cookie-secret
