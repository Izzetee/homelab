apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccount.yaml
  - pvc.yaml
  - external-secrets.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - network-policy.yaml
configMapGenerator:
  - name: agentgateway-config
    namespace: agentgateway
    files:
      - config.yaml
  - name: agentgateway-oidc-jwks
    namespace: agentgateway
    files:
      - oidc-jwks.json
generatorOptions:
  disableNameSuffixHash: true
