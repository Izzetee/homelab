# Workflow automation with a single-file SQLite database. It starts with no replicas: the data directory (database and the key file that
# encrypts the stored credentials) is restored first, checked, and only then is the application scaled up by hand. A later change sets the
# replicas to 1. The six environment values are those of the running instance; the key comes from the restored `config` file, not from the
# environment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n
    spec:
      automountServiceAccountToken: false
      # the data volume lives on one of the virtual machine nodes, which are the amd64 ones
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: n8n
          image: docker.io/n8nio/n8n:2.46.7@sha256:e97b4f576cd21de5c7676858f7006126581faeca8046d9d23fda0e06468008d4
          env:
            - name: N8N_HOST
              value: agent.chill-town.de
            - name: N8N_PORT
              value: "5678"
            - name: N8N_PROTOCOL
              value: https
            - name: NODE_ENV
              value: production
            - name: WEBHOOK_URL
              value: https://agent.chill-town.de/
            - name: GENERIC_TIMEZONE
              value: Europe/Berlin
          ports:
            - name: http
              containerPort: 5678
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
              subPath: data
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/node/.cache
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
