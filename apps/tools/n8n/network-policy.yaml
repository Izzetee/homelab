# Nothing in the namespace may send or receive anything unless a policy says so: pods without a policy of their own (helper pods, backup jobs)
# reach cluster DNS only. The application accepts the gateway on its port. While the data is being restored and checked it needs DNS only,
# so no workflow can reach anything outside; a later change opens what the workflows need.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: n8n
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: n8n
  namespace: n8n
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: n8n
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "5678"
              protocol: TCP
