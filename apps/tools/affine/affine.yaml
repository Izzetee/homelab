apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine
  namespace: affine
  labels:
    app.kubernetes.io/name: affine
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: affine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: affine
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: affine
          image: ghcr.io/toeverything/affine:0.27.4@sha256:b649f5ce2384ffdf13c23bccf81d759e15973d59d0b0058af65d895a84373099
          env:
            - name: HOME
              value: /home/node
            - name: AFFINE_SERVER_EXTERNAL_URL
              value: https://affine.chill-town.de
            - name: AFFINE_SERVER_HTTPS
              value: "true"
            - name: AFFINE_INDEXER_ENABLED
              value: "false"
            - name: REDIS_SERVER_HOST
              value: redis
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: affine-db-app
                  key: uri
          ports:
            - name: http
              containerPort: 3010
          startupProbe:
            httpGet:
              path: /info
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /info
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /info
              port: http
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: storage
              mountPath: /home/node/.affine/storage
              subPath: storage
            - name: storage
              mountPath: /home/node/.affine/config
              subPath: config
            - name: config
              mountPath: /home/node/.affine/config/config.json
              subPath: config.json
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: src
              mountPath: /app/src
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: affine-storage
        - name: config
          configMap:
            name: affine-config
        - name: tmp
          emptyDir: {}
        - name: src
          emptyDir: {}
