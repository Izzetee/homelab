apiVersion: v1
kind: ConfigMap
metadata:
  name: affine-config
  namespace: affine
data:
  config.json: |
    {
      "$schema": "https://github.com/toeverything/affine/releases/latest/download/config.schema.json",
      "server": {
        "name": "AFFiNE Self-hosted",
        "externalUrl": "https://affine.chill-town.de"
      },
      "copilot": {
        "enabled": true,
        "byok": {
          "enabled": true
        }
      }
    }
