apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cluster-18.yaml
  - pvc.yaml
  - config.yaml
  - affine.yaml
  - redis.yaml
  - service.yaml
  - predeploy.yaml
  - pg-dump.yaml
  - routes.yaml
  - network-policy.yaml
components:
  - ../../_backup-hook/affine
  - ../../_restore-check/pg
# settings of the restore check (apps/_restore-check)
configMapGenerator:
  - name: restore-check
    options:
      disableNameSuffixHash: true
    literals:
      - RC_SCHEDULE=0 5 * * 0
      - RC_PREFIX=affine-
      - RC_TABLES=users,workspaces
      - RC_KNOWN=users
      - RC_EXTENSIONS=vector
