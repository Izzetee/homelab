apiVersion: batch/v1
kind: CronJob
metadata:
  name: affine-pg-dump
  namespace: affine
  labels:
    app.kubernetes.io/name: affine-pg-dump
    homelab.io/backup: "true"
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: affine-pg-dump
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            fsGroup: 26
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dump
              image: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:5827829071060876c4029650c04183e4ee562da3ebb9e88c914d67c8dc8669d6
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  umask 077
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  # a manual run (pod name contains -manual-) never removes an older set: it refuses a set name that already exists and fails unless the directory then holds exactly the earlier entries plus its new set
                  host=$(cat /etc/hostname); manual=0; case "$host" in *-manual-*) manual=1 ;; esac
                  if [ "$manual" = 1 ]; then
                    for f in "affine-$stamp.dump" "affine-$stamp.dump.sha256"; do
                      if [ -e "/backup/$f" ] || [ -L "/backup/$f" ]; then echo "manual run: $f already exists" >&2; exit 1; fi
                    done
                    before=$(LC_ALL=C ls -1A /backup)
                  fi
                  pg_dump -Fc -h affine-db18-r -U affine -d affine -f "/backup/affine-$stamp.dump"
                  (cd /backup && sha256sum "affine-$stamp.dump" >"affine-$stamp.dump.sha256")
                  if [ "$manual" = 1 ]; then
                    after=$(LC_ALL=C ls -1A /backup)
                    [ "$after" = "$(printf '%s\n' "$before" "affine-$stamp.dump" "affine-$stamp.dump.sha256" | sed '/^$/d' | LC_ALL=C sort)" ] || { echo "manual run: the backup directory is not the earlier entries plus this set" >&2; exit 1; }
                  fi
                  printf %s "affine-$stamp" >/dev/termination-log
                  cd /backup
                  if [ "$manual" = 0 ]; then
                    ls -1 affine-*.dump | sort -r | tail -n +15 | while read -r f; do rm -f "$f" "$f.sha256"; done
                  fi
                  echo "dump affine-$stamp.dump written"
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: affine-db18-app
                      key: password
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: affine-backup
            - name: tmp
              emptyDir: {}
