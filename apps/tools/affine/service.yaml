apiVersion: v1
kind: Service
metadata:
  name: affine
  namespace: affine
  labels:
    app.kubernetes.io/name: affine
spec:
  selector:
    app.kubernetes.io/name: affine
  ports:
    - name: http
      port: 3010
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: affine
  labels:
    app.kubernetes.io/name: redis
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
