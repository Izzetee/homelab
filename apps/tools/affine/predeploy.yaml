apiVersion: batch/v1
kind: CronJob
metadata:
  name: affine-predeploy
  namespace: affine
  labels:
    app.kubernetes.io/name: affine-predeploy
spec:
  schedule: "0 0 1 1 *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: affine-predeploy
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: predeploy
              image: ghcr.io/toeverything/affine:0.27.4@sha256:b649f5ce2384ffdf13c23bccf81d759e15973d59d0b0058af65d895a84373099
              command: ["node", "./scripts/self-host-predeploy.js"]
              env:
                - name: HOME
                  value: /home/node
                - name: AFFINE_SERVER_EXTERNAL_URL
                  value: https://affine.chill-town.de
                - name: AFFINE_SERVER_HTTPS
                  value: "true"
                - name: AFFINE_INDEXER_ENABLED
                  value: "false"
                - name: REDIS_SERVER_HOST
                  value: redis
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: affine-db-app
                      key: uri
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: storage
                  mountPath: /home/node/.affine/storage
                  subPath: storage
                - name: storage
                  mountPath: /home/node/.affine/config
                  subPath: config
                - name: config
                  mountPath: /home/node/.affine/config/config.json
                  subPath: config.json
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: src
                  mountPath: /app/src
          volumes:
            - name: storage
              persistentVolumeClaim:
                claimName: affine-storage
            - name: config
              configMap:
                name: affine-config
            - name: tmp
              emptyDir: {}
            - name: src
              emptyDir: {}
