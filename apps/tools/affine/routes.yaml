apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: affine
  namespace: affine
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
      sectionName: tunnel
  hostnames:
    - affine.chill-town.de
  rules:
    - timeouts:
        request: 0s
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
      backendRefs:
        - name: affine
          port: 3010
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: affine-lan
  namespace: affine
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
      sectionName: lan
  hostnames:
    - affine.lan.chill-town.de
  rules:
    - timeouts:
        request: 0s
      backendRefs:
        - name: affine
          port: 3010
