# The PostgreSQL 18 database of affine (CloudNativePG). It was created by a one-time import from the former PostgreSQL 16 cluster, which is gone; the
# import settings are not kept. The operator creates the Secret `affine-db18-app` and the services `affine-db18-rw` and `affine-db18-r`.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: affine-db18
  namespace: affine
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:5827829071060876c4029650c04183e4ee562da3ebb9e88c914d67c8dc8669d6
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: affine
      owner: affine
      encoding: UTF8
      localeCollate: en_US.utf8
      localeCType: en_US.utf8
  storage:
    size: 2Gi
    storageClass: local-path-retain
  affinity:
    nodeSelector:
      kubernetes.io/arch: amd64
      kubernetes.io/hostname: k3s-agent-1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
