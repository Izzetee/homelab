# Status monitor with a single-file SQLite database. It starts with no replicas: the data directory is restored first and only then is the
# application scaled up by hand, so it never creates a fresh database next to the restored one. A later change sets the replicas to 1.
# The image runs as root by default; here it runs as uid 1000 and writes only to its data directory and a scratch directory.
# ICMP echo for ping monitors uses datagram sockets (the namespaced sysctl), so no capability is needed. The image's `ping` carries a file capability
# that cannot execute once all capabilities are dropped, so an init container copies the binary (without the file attribute) to a scratch directory
# that comes first in the search path.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
  labels:
    app.kubernetes.io/name: uptime-kuma
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: uptime-kuma
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uptime-kuma
    spec:
      automountServiceAccountToken: false
      # the data volume lives on one of the virtual machine nodes, which are the amd64 ones
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
        sysctls:
          - name: net.ipv4.ping_group_range
            value: "0 2147483647"
      initContainers:
        - name: ping-copy
          image: docker.io/louislam/uptime-kuma:2.5.9@sha256:e88415a90dd2f7efecdbc18de0490aff292764a3ac471531bf1d0481725591bd
          command: ["cp", "/usr/bin/ping", "/ping/ping"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: ping
              mountPath: /ping
      containers:
        - name: uptime-kuma
          image: docker.io/louislam/uptime-kuma:2.5.9@sha256:e88415a90dd2f7efecdbc18de0490aff292764a3ac471531bf1d0481725591bd
          env:
            - name: PATH
              value: /ping:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          ports:
            - name: http
              containerPort: 3001
          # the root path answers with a redirect to the entry page, which counts as success
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
            - name: ping
              mountPath: /ping
              readOnly: true
      volumes:
        - name: ping
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: uptime-kuma-data
        - name: tmp
          emptyDir: {}
