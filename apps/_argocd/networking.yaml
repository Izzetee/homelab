apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: networking
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: https://github.com/Izzetee/homelab.git
    targetRevision: main
    path: networking
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
