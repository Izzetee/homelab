apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hl-access
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: platform
  source:
    repoURL: https://github.com/Izzetee/homelab.git
    targetRevision: main
    path: apps/platform/hl-access
  destination:
    server: https://kubernetes.default.svc
    namespace: hl-access
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
