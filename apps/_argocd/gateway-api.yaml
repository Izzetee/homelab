apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: platform
  source:
    # upstream repository at the commit of the release tag v1.6.3 (a tag can move, a commit cannot)
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: c0836133e24073fcdcdbb1713aba3cc73a89d0b5
    path: config/crd/standard
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
