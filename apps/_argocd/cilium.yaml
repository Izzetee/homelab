apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  sources:
    - repoURL: https://helm.cilium.io
      chart: cilium
      targetRevision: 1.20.4
      helm:
        releaseName: cilium
        valueFiles:
          - $values/apps/platform/cilium/values.yaml
    - repoURL: https://github.com/Izzetee/homelab.git
      targetRevision: main
      ref: values
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
