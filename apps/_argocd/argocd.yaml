apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.18.0
      helm:
        releaseName: argocd
        valueFiles:
          - $values/apps/platform/argocd/values.yaml
    - repoURL: https://github.com/Izzetee/homelab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/Izzetee/homelab.git
      targetRevision: main
      path: apps/platform/argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
