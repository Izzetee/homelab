# Nightly dump of the database with pg_dump -Fc into the backup volume, files private (umask 077). The scheduled run keeps the 14 newest sets;
# a manual run (pod name contains -manual-) keeps all. The password is read from the Secret the operator generates, through the environment
# (never an argument). fsGroupChangePolicy keeps later pod mounts from widening the mode of older files.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: authentik-pg-dump
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-pg-dump
    homelab.io/backup: "true"
spec:
  schedule: "45 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: authentik-pg-dump
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          # the NFS export lists the three virtual machine nodes, which are the amd64 ones
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            fsGroup: 26
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dump
              image: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:5827829071060876c4029650c04183e4ee562da3ebb9e88c914d67c8dc8669d6
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  umask 077
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  pg_dump -Fc -h authentik-db18-r -U authentik -d authentik -f "/backup/authentik-$stamp.dump"
                  (cd /backup && sha256sum "authentik-$stamp.dump" >"authentik-$stamp.dump.sha256")
                  printf %s "authentik-$stamp" >/dev/termination-log
                  cd /backup
                  # a manual run (pod name contains -manual-) never removes an older set
                  case "$(cat /etc/hostname)" in
                    *-manual-*) ;;
                    *) ls -1 authentik-*.dump | sort -r | tail -n +15 | while read -r f; do rm -f "$f" "$f.sha256"; done ;;
                  esac
                  echo "dump authentik-$stamp.dump written"
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: authentik-db18-app
                      key: password
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: authentik-backup
            - name: tmp
              emptyDir: {}
