# Nightly dump of the database with pg_dump -Fc into the backup volume, files private (umask 077), the 14 newest kept. The password is
# read from the Secret the operator generates, through the environment (never an argument). fsGroupChangePolicy keeps later pod mounts
# from widening the mode of older files.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: authentik-pg-dump
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-pg-dump
    homelab.io/backup: "true"
spec:
  schedule: "45 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: authentik-pg-dump
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          # the NFS export lists the three virtual machine nodes, which are the amd64 ones
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            fsGroup: 26
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dump
              image: ghcr.io/cloudnative-pg/postgresql:16.16-standard-trixie@sha256:56ff6dee0ae923d9b796fe645f7d39c46e109952dbecdf560db4d2a9c243e02a
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  umask 077
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  pg_dump -Fc -h authentik-db-r -U authentik -d authentik -f "/backup/authentik-$stamp.dump"
                  (cd /backup && sha256sum "authentik-$stamp.dump" >"authentik-$stamp.dump.sha256")
                  cd /backup
                  ls -1 authentik-*.dump | sort -r | tail -n +15 | while read -r f; do rm -f "$f" "$f.sha256"; done
                  echo "dump authentik-$stamp.dump written"
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: authentik-db-app
                      key: password
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: authentik-backup
            - name: tmp
              emptyDir: {}
