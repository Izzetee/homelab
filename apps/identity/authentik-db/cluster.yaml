# The database of Authentik: one PostgreSQL 16 instance (the operand image is pinned by digest, minor 16.16) on the retaining local
# storage class, on an amd64 node. The operator creates the Secret `authentik-db-app` (user and password of the owner `authentik`) and
# the services `authentik-db-rw` and `authentik-db-r`.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-db
  namespace: authentik
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.16-standard-trixie@sha256:56ff6dee0ae923d9b796fe645f7d39c46e109952dbecdf560db4d2a9c243e02a
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
  storage:
    size: 2Gi
    storageClass: local-path-retain
  affinity:
    nodeSelector:
      kubernetes.io/arch: amd64
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
