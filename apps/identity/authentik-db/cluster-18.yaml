# The PostgreSQL 18 database of authentik: a new cluster, imported from the frozen PostgreSQL 16 cluster `authentik-db` (CloudNativePG
# `bootstrap.initdb.import`, type microservice: one database, one owner, no roles). The old cluster is not changed; it is the way back
# until the soak after the switch has passed. The operator creates the Secret `authentik-db18-app` and the services `authentik-db18-rw` and `authentik-db18-r`.
# The import connects as the owner with the old cluster's password and CA (verify-full against the `-rw` service name).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-db18
  namespace: authentik
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:5827829071060876c4029650c04183e4ee562da3ebb9e88c914d67c8dc8669d6
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      import:
        type: microservice
        databases:
          - authentik
        source:
          externalCluster: authentik-db
  externalClusters:
    - name: authentik-db
      connectionParameters:
        host: authentik-db-rw
        user: authentik
        dbname: authentik
        sslmode: verify-full
      password:
        name: authentik-db-app
        key: password
      sslRootCert:
        name: authentik-db-ca
        key: ca.crt
  storage:
    size: 2Gi
    storageClass: local-path-retain
  affinity:
    nodeSelector:
      kubernetes.io/arch: amd64
      kubernetes.io/hostname: k3s-agent-1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
