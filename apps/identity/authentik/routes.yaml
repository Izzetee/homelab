# Both routes are plain manifests with exact hostnames and an explicit listener; the chart's own route and ingress are off.
# The public name on the HTTP listener behind the tunnel (no DNS opt-in: its record is an existing one, moved only by a recorded cutover),
# the LAN name on the HTTPS listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik
  namespace: authentik
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
      sectionName: tunnel
  hostnames:
    - auth.chill-town.de
  rules:
    - backendRefs:
        - name: authentik-server
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik-lan
  namespace: authentik
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
      sectionName: lan
  hostnames:
    - auth.lan.chill-town.de
  rules:
    - backendRefs:
        - name: authentik-server
          port: 80
