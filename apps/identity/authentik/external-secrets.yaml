# The secrets of Authentik, read from the store. `Orphan` keeps a Secret if its ExternalSecret is ever deleted; the operator copies
# the annotations below to the Secret, so Argo CD never counts it as out of sync or prunes it. Values live in OpenBao only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secret-key
  namespace: authentik
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: authentik-secret-key
    creationPolicy: Orphan
  data:
    - secretKey: secret-key
      remoteRef:
        key: authentik/authentik-secret-key
        property: secret-key
---
# The client secrets of the OIDC clients of the blueprints (argocd, grafana), generated in the store.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-oidc-clients
  namespace: authentik
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: authentik-oidc-clients
    creationPolicy: Orphan
  data:
    - secretKey: argocd
      remoteRef:
        key: authentik/oidc-clients
        property: argocd
    - secretKey: grafana
      remoteRef:
        key: authentik/oidc-clients
        property: grafana
