# The secrets of Authentik, read from the store. `Orphan` keeps a Secret if its ExternalSecret is ever deleted; the operator copies
# the annotations below to the Secret, so Argo CD never counts it as out of sync or prunes it. Values live in OpenBao only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secret-key
  namespace: authentik
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: authentik-secret-key
    creationPolicy: Orphan
  data:
    - secretKey: secret-key
      remoteRef:
        key: authentik/authentik-secret-key
        property: secret-key
---
# The client secrets of the OIDC clients of the blueprints (argocd, grafana, openbao, openbao-ui, outline, agentgateway), generated in the store.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-oidc-clients
  namespace: authentik
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: authentik-oidc-clients
    creationPolicy: Orphan
  data:
    - secretKey: argocd
      remoteRef:
        key: authentik/oidc-clients
        property: argocd
    - secretKey: grafana
      remoteRef:
        key: authentik/oidc-clients
        property: grafana
    - secretKey: openbao
      remoteRef:
        key: authentik/oidc-clients
        property: openbao
    - secretKey: openbao-ui
      remoteRef:
        key: authentik/oidc-clients
        property: openbao-ui
    # the wiki's client secret lives at the wiki's own store path, so the wiki reads nothing of the other clients
    - secretKey: outline
      remoteRef:
        key: apps/wiki/oidc
        property: client-secret
    # the gateway's client secret lives at the gateway's own store path, so the gateway reads nothing of the other clients
    - secretKey: agentgateway
      remoteRef:
        key: agentgateway/ui-oidc
        property: client-secret
