apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - service-account.yaml
  - external-secrets.yaml
  - routes.yaml
  - network-policy.yaml
# the chart mounts this ConfigMap by name into the worker (blueprints.configMaps), so the name carries no hash suffix
configMapGenerator:
  - name: authentik-blueprints
    files:
      - blueprints/argocd.yaml
      - blueprints/grafana.yaml
generatorOptions:
  disableNameSuffixHash: true
