# OIDC client of the sign-in proxy in front of the Hubble UI (declared here, never by the admin UI). The client secret is read from the
# environment of the worker, which takes it from the store path the proxy itself reads. The redirect URI is exact (strict matching), the
# user is the built-in admin group.
version: 1
metadata:
  name: homelab-oidc-hubble-ui
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    state: present
    identifiers:
      name: hubble-ui
    attrs:
      client_type: confidential
      client_id: hubble-ui
      # new providers start without grant types; the proxy uses the code flow and refreshes the session
      grant_types:
        - authorization_code
        - refresh_token
      client_secret:
        !Env AUTHENTIK_OIDC_HUBBLE_UI_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: https://hubble.lan.chill-town.de/oauth2/callback
      # group membership is read again on every refresh; the refresh token is renewed only near its end, so parallel requests share one token
      refresh_token_threshold: hours=1
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
  - model: authentik_core.application
    id: application
    state: present
    identifiers:
      slug: hubble-ui
    attrs:
      name: Hubble UI
      provider: !KeyOf provider
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf application
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
