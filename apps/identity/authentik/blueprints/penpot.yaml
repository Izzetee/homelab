# OIDC client of the Penpot application itself (declared here, never by the admin UI). The client secret is read from the environment of
# the worker, which takes it from the store path Penpot reads. The redirect URI is exact (strict matching). The application is bound to the
# existing group `penpot-users` by lookup (the group is declared by penpot-cloudflare.yaml).
version: 1
metadata:
  name: homelab-oidc-penpot
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    state: present
    identifiers:
      name: penpot
    attrs:
      client_type: confidential
      client_id: penpot
      # new providers start without grant types
      grant_types:
        - authorization_code
      client_secret:
        !Env AUTHENTIK_OIDC_PENPOT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: https://penpot.chill-town.de/api/auth/oidc/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    id: application
    state: present
    identifiers:
      slug: penpot
    attrs:
      name: Penpot
      provider: !KeyOf provider
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf application
      group: !Find [authentik_core.group, [name, penpot-users]]
      order: 0
