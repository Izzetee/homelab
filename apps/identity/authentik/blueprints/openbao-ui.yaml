# OIDC client of the secret store's web UI (declared here, never by the admin UI), separate from the client of the command-line login so the
# consent page names the application and each login keeps its own strict redirect. The client secret is read from the environment of the worker.
# The redirect URI is exact (strict matching) and is the UI's own callback page; the user is the built-in admin group. The provider has its own
# authorization flow with a consent stage that asks every time, so each sign-in is approved on the consent page. No object restored from the
# previous installation is named or changed.
version: 1
metadata:
  name: homelab-oidc-openbao-ui
entries:
  - model: authentik_stages_consent.consentstage
    id: consent
    state: present
    identifiers:
      name: openbao-ui-authorization-consent
    attrs:
      mode: always_require
  - model: authentik_flows.flow
    id: flow
    state: present
    identifiers:
      slug: openbao-ui-authorization-explicit-consent
    attrs:
      designation: authorization
      name: Authorize secret store UI login
      title: Redirecting to %(app)s
      authentication: require_authenticated
  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf consent
      order: 10
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    state: present
    identifiers:
      name: openbao-ui
    attrs:
      client_type: confidential
      client_id: openbao-ui
      client_secret:
        !Env AUTHENTIK_OIDC_OPENBAO_UI_SECRET
      authorization_flow: !KeyOf flow
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: https://bao.lan.chill-town.de/ui/vault/auth/oidc-ui/oidc/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    id: application
    state: present
    identifiers:
      slug: openbao-ui
    attrs:
      name: OpenBao UI (admin)
      provider: !KeyOf provider
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf application
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
