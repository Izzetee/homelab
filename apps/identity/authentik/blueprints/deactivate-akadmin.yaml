# Keeps the built-in account akadmin inactive if it exists; skips when absent. Only the `is_active` flag is set; nothing is created or deleted.
version: 1
metadata:
  name: homelab-deactivate-akadmin
entries:
  - model: authentik_core.user
    state: present
    conditions:
      - !Condition [AND, !Find [authentik_core.user, [username, akadmin]]]
    identifiers:
      username: akadmin
    attrs:
      is_active: false
