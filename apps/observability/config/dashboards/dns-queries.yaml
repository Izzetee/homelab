# DNS query log dashboard (written for this repository): top domains, clients and the filterable query log. Reads the `blocky` log stream in Loki.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dns-queries
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  dns-queries.json: |
    {
      "uid": "dns-queries",
      "title": "DNS queries (Blocky query log)",
      "tags": [
        "homelab",
        "dns"
      ],
      "timezone": "utc",
      "schemaVersion": 39,
      "version": 1,
      "editable": false,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "bargauge",
          "title": "Top queried domains",
          "description": "Most asked names over the selected range.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 9
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "topk(10, sum by (question_name) (count_over_time({namespace=\"blocky\",container=\"blocky\"} |= \"query resolved\" | json [$__range])))",
              "legendFormat": "{{question_name}}",
              "refId": "A",
              "instant": true,
              "queryType": "instant"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "displayMode": "gradient"
          }
        },
        {
          "id": 2,
          "type": "bargauge",
          "title": "Top blocked domains",
          "description": "Most blocked names over the selected range.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 9
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "topk(10, sum by (question_name) (count_over_time({namespace=\"blocky\",container=\"blocky\"} |= \"query resolved\" | json | response_type=\"BLOCKED\" [$__range])))",
              "legendFormat": "{{question_name}}",
              "refId": "A",
              "instant": true,
              "queryType": "instant"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "displayMode": "gradient"
          }
        },
        {
          "id": 3,
          "type": "bargauge",
          "title": "Top NXDOMAIN domains",
          "description": "Names that do not exist, most asked over the selected range.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 9,
            "w": 12,
            "h": 9
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "topk(10, sum by (question_name) (count_over_time({namespace=\"blocky\",container=\"blocky\"} |= \"query resolved\" | json | response_code=\"NXDOMAIN\" [$__range])))",
              "legendFormat": "{{question_name}}",
              "refId": "A",
              "instant": true,
              "queryType": "instant"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "displayMode": "gradient"
          }
        },
        {
          "id": 4,
          "type": "bargauge",
          "title": "Top clients",
          "description": "Queries per client over the selected range.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 12,
            "y": 9,
            "w": 12,
            "h": 9
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "topk(10, sum by (client_ip) (count_over_time({namespace=\"blocky\",container=\"blocky\"} |= \"query resolved\" | json [$__range])))",
              "legendFormat": "{{client_ip}}",
              "refId": "A",
              "instant": true,
              "queryType": "instant"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "displayMode": "gradient"
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Queries by response type",
          "description": "Queries per interval by how they were answered.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 18,
            "w": 24,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum by (response_type) (count_over_time({namespace=\"blocky\",container=\"blocky\"} |= \"query resolved\" | json [$__interval]))",
              "legendFormat": "{{response_type}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 6,
          "type": "logs",
          "title": "Query log",
          "description": "One line per resolved query; filter with the domain and client boxes above.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 26,
            "w": 24,
            "h": 14
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "{namespace=\"blocky\",container=\"blocky\"} |= \"query resolved\" | json | question_name=~\"(?i).*${domain}.*\" | client_ip=~\".*${client}.*\"",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "wrapLogMessage": false,
            "sortOrder": "Descending",
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "prettifyLogMessage": false
          }
        }
      ],
      "templating": {
        "list": [
          {
            "name": "domain",
            "label": "domain contains",
            "type": "textbox",
            "query": "",
            "current": {
              "text": "",
              "value": ""
            },
            "options": [
              {
                "selected": true,
                "text": "",
                "value": ""
              }
            ],
            "hide": 0
          },
          {
            "name": "client",
            "label": "client address contains",
            "type": "textbox",
            "query": "",
            "current": {
              "text": "",
              "value": ""
            },
            "options": [
              {
                "selected": true,
                "text": "",
                "value": ""
              }
            ],
            "hide": 0
          }
        ]
      }
    }
