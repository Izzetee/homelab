# Scrapes of LAN devices (the NAS and Home Assistant below, the hosts outside the cluster at the end). The NAS modules: Synology's own MIB, the interface table, and net-snmp's CPU and memory tables (the Synology
# MIB of this DSM carries no CPU or memory values). The NAS is read over SNMPv3 through the SNMP exporter (the exporter is the scrape address, the
# NAS is the `target` parameter); Home Assistant serves its own metrics endpoint and is read with a bearer token from a Secret.
# The operator rejects a ScrapeConfig whose Secret key is missing, so nothing is scraped without the token.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: nas
  namespace: monitoring
spec:
  jobName: nas
  metricsPath: /snmp
  scrapeInterval: 60s
  scrapeTimeout: 30s
  params:
    module: [synology, if_mib, ucd_system_stats, ucd_memory]
    auth: [nas_v3]
  staticConfigs:
    - targets:
        - 192.168.1.117
  relabelings:
    - sourceLabels: [__address__]
      targetLabel: __param_target
    - sourceLabels: [__param_target]
      targetLabel: instance
    - targetLabel: __address__
      replacement: prometheus-snmp-exporter.monitoring.svc:9116
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: home-assistant
  namespace: monitoring
spec:
  jobName: home-assistant
  scheme: HTTP
  metricsPath: /api/prometheus
  scrapeInterval: 60s
  scrapeTimeout: 20s
  authorization:
    type: Bearer
    credentials:
      name: home-assistant-token
      key: token
  # who is home and where never enters the cluster: the person and device_tracker domains are dropped here as well as at the source
  metricRelabelings:
    - sourceLabels: [domain]
      regex: person|device_tracker
      action: drop
    # the integration's metric prefix depends on its `namespace` setting; the dashboards and rules use `homeassistant_`
    - sourceLabels: [__name__]
      regex: hass_(.*)
      targetLabel: __name__
      replacement: homeassistant_$1
      action: replace
  staticConfigs:
    - targets:
        - 192.168.1.30:8123
---
# Host metrics of machines outside the cluster (an admin host and the virtualization hosts): the distribution's node exporter, listening on the host's
# LAN address only. The job label is the one of the cluster's node exporters, so the node dashboards and rules cover these hosts too.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: hosts
  namespace: monitoring
spec:
  jobName: node-exporter
  scheme: HTTP
  metricsPath: /metrics
  scrapeInterval: 30s
  scrapeTimeout: 10s
  staticConfigs:
    - targets:
        - 192.168.1.98:9100
        - 192.168.1.248:9100
        - 192.168.1.249:9100
