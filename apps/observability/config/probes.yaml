# The store's web UI on its LAN name: exactly 200 (the route's UI rule is up), and the system endpoints that must stay cluster-only (root-token
# generation, unseal, metrics) on the same name: exactly 404 (the gateway answers; a forwarded endpoint turns it into another status).
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: openbao-ui-lan
  namespace: monitoring
spec:
  module: http_200
  interval: 60s
  prober:
    url: prometheus-blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      static:
        - https://bao.lan.chill-town.de/ui/
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: openbao-lan-sys-denied
  namespace: monitoring
spec:
  module: http_404
  interval: 60s
  prober:
    url: prometheus-blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      static:
        - https://bao.lan.chill-town.de/v1/sys/generate-root/attempt
        - https://bao.lan.chill-town.de/v1/sys/unseal
        - https://bao.lan.chill-town.de/v1/sys/metrics
