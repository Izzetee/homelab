# Scrape targets that live outside the observability namespaces. The monitors sit in `monitoring` and select their Service
# with a namespaceSelector.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: coredns
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      k8s-app: kube-dns
  endpoints:
    - port: metrics
      interval: 30s
      relabelings:
        - action: replace
          targetLabel: job
          replacement: coredns
---
