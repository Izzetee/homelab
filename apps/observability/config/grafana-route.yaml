# Grafana on the LAN listener of the gateway only (never on the tunnel listener).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
      sectionName: lan
  hostnames:
    - grafana.lan.chill-town.de
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
