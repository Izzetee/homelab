# promtool unit tests of homelab-secret-store.yaml: one firing and one quiet case per rule. The rule file list is replaced by the
# rendered rule files when the tests run.
rule_files:
  - rules.yml
evaluation_interval: 1m
tests:
  - name: openbao pod sealed
    interval: 1m
    input_series:
      - series: 'vault_core_unsealed{pod="openbao-0"}'
        values: '1+0x15'
      - series: 'vault_core_unsealed{pod="openbao-1"}'
        values: '0+0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: OpenBaoSealed
        exp_alerts:
          - exp_labels: {severity: critical, pod: openbao-1}
            exp_annotations: {summary: "An OpenBao pod is sealed, or no OpenBao metrics arrive"}
  - name: openbao metrics absent
    interval: 1m
    input_series:
      - series: 'up{job="unrelated"}'
        values: '1+0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: OpenBaoSealed
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations: {summary: "An OpenBao pod is sealed, or no OpenBao metrics arrive"}
  - name: openbao all unsealed
    interval: 1m
    input_series:
      - series: 'vault_core_unsealed{pod="openbao-0"}'
        values: '1+0x15'
      - series: 'vault_core_unsealed{pod="openbao-1"}'
        values: '1+0x15'
      - series: 'vault_core_unsealed{pod="openbao-2"}'
        values: '1+0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: OpenBaoSealed
        exp_alerts: []
  - name: raft voter missing
    interval: 1m
    input_series:
      - series: 'vault_autopilot_node_healthy{node_id="openbao-0",pod="openbao-1"}'
        values: '1+0x30'
      - series: 'vault_autopilot_node_healthy{node_id="openbao-1",pod="openbao-1"}'
        values: '1+0x30'
      - series: 'vault_autopilot_node_healthy{node_id="openbao-2",pod="openbao-1"}'
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: OpenBaoRaftPeersMissing
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations: {summary: "Fewer than three healthy OpenBao raft voters"}
  - name: raft voters complete
    interval: 1m
    input_series:
      - series: 'vault_autopilot_node_healthy{node_id="openbao-0",pod="openbao-1"}'
        values: '1+0x30'
      - series: 'vault_autopilot_node_healthy{node_id="openbao-1",pod="openbao-1"}'
        values: '1+0x30'
      - series: 'vault_autopilot_node_healthy{node_id="openbao-2",pod="openbao-1"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: OpenBaoRaftPeersMissing
        exp_alerts: []
  - name: external secret not ready
    interval: 1m
    input_series:
      - series: 'externalsecret_status_condition{condition="Ready",status="False",name="grafana-admin",namespace="monitoring"}'
        values: '1+0x30'
      - series: 'externalsecret_status_condition{condition="Ready",status="True",name="grafana-admin",namespace="monitoring"}'
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: ExternalSecretNotReady
        exp_alerts:
          - exp_labels: {severity: warning, condition: Ready, status: "False", name: grafana-admin, namespace: monitoring}
            exp_annotations: {summary: "ExternalSecret grafana-admin in monitoring is not ready"}
  - name: external secret ready
    interval: 1m
    input_series:
      - series: 'externalsecret_status_condition{condition="Ready",status="False",name="grafana-admin",namespace="monitoring"}'
        values: '0+0x30'
      - series: 'externalsecret_status_condition{condition="Ready",status="True",name="grafana-admin",namespace="monitoring"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: ExternalSecretNotReady
        exp_alerts: []
  - name: openbao certificate close to expiry
    interval: 1m
    input_series:
      # expiry 10 days after the start of the test
      - series: 'probe_ssl_earliest_cert_expiry{instance="https://openbao-active.openbao.svc:8200/v1/sys/health"}'
        values: '864000+0x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: OpenBaoCertExpiresSoon
        exp_alerts:
          - exp_labels: {severity: warning, instance: "https://openbao-active.openbao.svc:8200/v1/sys/health"}
            exp_annotations: {summary: "The certificate served by OpenBao expires in less than 14 days (restart the StatefulSet after the renewal)"}
  - name: openbao certificate valid for a long time
    interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{instance="https://openbao-active.openbao.svc:8200/v1/sys/health"}'
        values: '31536000+0x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: OpenBaoCertExpiresSoon
        exp_alerts: []
