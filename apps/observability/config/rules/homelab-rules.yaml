# Alerts of the homelab on top of the default rules of kube-prometheus-stack (which also cover crash loops and failed
# jobs). Unit tests: tests/homelab-rules.yaml (promtool).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab
  namespace: monitoring
spec:
  groups:
    - name: homelab
      rules:
        - alert: HomelabNodeDiskAbove80
          expr: |
            (1 - node_filesystem_avail_bytes{fstype=~"ext4|xfs"} / node_filesystem_size_bytes{fstype=~"ext4|xfs"}) > 0.8
              and on (instance, device, mountpoint) node_filesystem_readonly{fstype=~"ext4|xfs"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Filesystem {{ $labels.mountpoint }} of {{ $labels.instance }} is more than 80 % full"
        # a container that thrashes against its memory limit re-reads its pages from disk (kube-rbac-proxy of node-exporter did,
        # 1-2 GB/s for hours); sustained reads far above any normal load of a node disk
        - alert: HomelabNodeDiskReadHigh
          expr: max by (instance, device) (rate(node_disk_read_bytes_total{device!~"dm-.*"}[5m])) > 500e6
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Disk {{ $labels.device }} of {{ $labels.instance }} reads more than 500 MB/s for 10 minutes"
        - alert: HomelabVolumeAbove80
          expr: kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 0.8
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Volume {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} is more than 80 % full"
        - alert: HomelabDatabaseNotReady
          expr: |
            (kube_pod_status_ready{condition="false"} == 1)
              and on (namespace, pod) kube_pod_labels{label_cnpg_io_cluster!=""}
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Database pod {{ $labels.pod }} in {{ $labels.namespace }} is not ready"
        - alert: HomelabCertificateNotReady
          expr: certmanager_certificate_ready_status{condition="False"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.name }} in {{ $labels.namespace }} is not ready"
        - alert: HomelabCertificateExpiresSoon
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 24 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.name }} in {{ $labels.namespace }} expires in less than 14 days"
        - alert: HomelabArgoAppUnhealthy
          expr: homelab_argocd_app_health_status{health_status=~"Degraded|Missing"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Application {{ $labels.name }} is {{ $labels.health_status }}"
        - alert: HomelabArgoAppOutOfSync
          expr: homelab_argocd_app_sync_status{sync_status="OutOfSync"} == 1
          for: 60m
          labels:
            severity: warning
          annotations:
            summary: "Application {{ $labels.name }} is out of sync"
        - alert: HomelabBackupTooOld
          expr: |
            (time() - kube_cronjob_status_last_successful_time
                and on (namespace, cronjob) kube_cronjob_labels{label_homelab_io_backup="true"}) > 26 * 3600
            or
            ((time() - kube_cronjob_created)
                and on (namespace, cronjob) kube_cronjob_labels{label_homelab_io_backup="true"}
                unless on (namespace, cronjob) kube_cronjob_status_last_successful_time) > 26 * 3600
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Backup job {{ $labels.cronjob }} in {{ $labels.namespace }} has no success for more than 26 hours"
        - alert: HomelabEtcdSnapshotTooOld
          expr: |
            time() - max(homelab_etcd_snapshot_created_timestamp_seconds
              and on (name) homelab_etcd_snapshot_ready == 1) > 7 * 3600
            or absent(homelab_etcd_snapshot_ready == 1)
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "The newest ready etcd snapshot is older than 7 hours"
        - alert: HomelabProbeFailed
          expr: probe_success == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Probe of {{ $labels.instance }} fails"
        # Checks from a host outside the cluster (a timer there writes homelab_lan_vip_up for the host exporter's textfile
        # collector). In-cluster probes cannot see a lost layer-2 announcement: traffic to a load balancer address is
        # balanced in eBPF without ARP. The first two rules are about the check itself, the third keeps "every address has a
        # check" true. Limit: Unprobed counts every assigned load balancer address, because all of them are announced on the
        # LAN today; an address that is not meant for the LAN needs a selector here.
        - alert: HomelabLanVipDown
          expr: homelab_lan_vip_up == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "LAN address {{ $labels.ip }} fails its {{ $labels.check }} check for {{ $labels.name }} from outside the cluster"
        - alert: HomelabLanVipProbeMissing
          expr: |
            absent(homelab_lan_vip_last_run_timestamp_seconds)
              or (time() - homelab_lan_vip_last_run_timestamp_seconds > 300)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "The check of the LAN load balancer addresses from outside the cluster has not run for more than 5 minutes"
        - alert: HomelabLanVipUnprobed
          expr: |
            (kube_service_status_load_balancer_ingress unless on (ip) homelab_lan_vip_up)
              and on () (count(homelab_lan_vip_up) > 0)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Load balancer address {{ $labels.ip }} of {{ $labels.namespace }}/{{ $labels.service }} has no check from outside the cluster"
        # Canary DaemonSet `signal-canary` (signal-canary.yaml): not ready on a node means containers there cannot signal their own
        # child processes, which is what a container AppArmor profile without the stacked-label peer rules does on newer kernels
        # (databases then lose autovacuum and hang on parallel workers and stops). A missing or unscheduled canary pod is covered
        # by the default KubeDaemonSet rules.
        - alert: HomelabContainerSignalBlocked
          expr: |
            max by (node) (
              (kube_pod_status_ready{namespace="monitoring",condition="false"} == 1)
                * on (namespace, pod) group_left (node)
              kube_pod_info{namespace="monitoring",created_by_kind="DaemonSet",created_by_name="signal-canary"}
            )
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Containers on node {{ $labels.node }} cannot signal each other (AppArmor)"
