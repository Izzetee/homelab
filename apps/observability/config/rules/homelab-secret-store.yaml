# Alerts of the secret store (OpenBao and the External Secrets operator). The backup age of the OpenBao snapshot job is covered by
# HomelabBackupTooOld in homelab-rules.yaml (the job carries the label homelab.io/backup=true). Unit tests:
# tests/homelab-secret-store.yaml (promtool).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-secret-store
  namespace: monitoring
spec:
  groups:
    - name: homelab-secret-store
      rules:
        - alert: OpenBaoSealed
          expr: vault_core_unsealed == 0 or absent(vault_core_unsealed)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "An OpenBao pod is sealed, or no OpenBao metrics arrive"
        - alert: OpenBaoRaftPeersMissing
          expr: (count(vault_autopilot_node_healthy == 1) or vector(0)) < 3
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Fewer than three healthy OpenBao raft voters"
        - alert: ExternalSecretNotReady
          expr: externalsecret_status_condition{condition="Ready", status="False"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ExternalSecret {{ $labels.name }} in {{ $labels.namespace }} is not ready"
        - alert: OpenBaoCertExpiresSoon
          expr: probe_ssl_earliest_cert_expiry{instance=~".*openbao-active.*"} - time() < 14 * 24 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "The certificate served by OpenBao expires in less than 14 days (restart the StatefulSet after the renewal)"
