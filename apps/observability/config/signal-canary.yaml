# One pod on every node (the Raspberry Pis included) that proves containers can signal their own child processes under the default
# container AppArmor profile. Newer kernels stack that profile with `unconfined`; a profile without the stacked-peer rules then denies
# every signal between two processes of one container (the node-prep role in ansible/ loads the profile that allows it).
# Ready only while both lineages work: the main process starts a child and stops it with SIGTERM every minute and keeps /tmp/ok while
# that works; the readiness probe (exec lineage, stacked on every kernel) needs /tmp/ok and does the same with its own child.
# Not ready, never restarted: no liveness probe and the main process does not exit on a failure. Alert: HomelabContainerSignalBlocked.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: signal-canary
  namespace: monitoring
  labels:
    app.kubernetes.io/name: signal-canary
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: signal-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signal-canary
    spec:
      automountServiceAccountToken: false
      tolerations:
        # the Raspberry Pi nodes carry this taint
        - key: homelab.io/pi
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: canary
          # only for its busybox sh, sleep and kill (multi-arch index: linux/amd64 and linux/arm64)
          image: docker.io/library/python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
          command:
            - /bin/sh
            - -c
            - |
              while :; do
                sleep 300 & p=$!
                if kill -TERM "$p" 2>/dev/null && wait "$p" 2>/dev/null; [ $? -eq 143 ]; then : >/tmp/ok; else rm -f /tmp/ok; fi
                sleep 60 & wait $!
              done
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'test -f /tmp/ok || exit 1; sleep 30 & p=$!; kill -TERM "$p" || exit 1; wait "$p"; test $? -eq 143'
            initialDelaySeconds: 5
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 2
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
