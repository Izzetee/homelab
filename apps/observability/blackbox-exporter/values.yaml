# Blackbox exporter for the Probe objects of apps/observability/config (chart prometheus-community/prometheus-blackbox-exporter,
# pinned in the Application). The HTTP modules follow no redirect and accept only the exact expected answer; the DNS modules check
# the resolvers (Pi-hole, the LAN resolver and its two public upstreams).
image:
  tag: "v0.29.1"
  digest: "sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13"
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi
config:
  modules:
    http_2xx: null
    http_200:
      prober: http
      timeout: 10s
      http:
        method: GET
        valid_status_codes: [200]
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        no_follow_redirects: true
        preferred_ip_protocol: ip4
        tls_config:
          insecure_skip_verify: false
    # an endpoint that must be behind a login: the exact answer is the 302 to the login page (no redirect is followed, no fetch headers are sent);
    # a removed login turns it into another status
    http_302:
      prober: http
      timeout: 10s
      http:
        method: GET
        valid_status_codes: [302]
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        no_follow_redirects: true
        preferred_ip_protocol: ip4
        tls_config:
          insecure_skip_verify: false
    # an endpoint that must stay absent: the exact answer is 404 (a forwarded admin endpoint of the model gateway turns it into another status)
    http_404:
      prober: http
      timeout: 10s
      http:
        method: GET
        valid_status_codes: [404]
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        no_follow_redirects: true
        preferred_ip_protocol: ip4
        tls_config:
          insecure_skip_verify: false
    # OpenBao's active node: the served certificate's expiry is what is measured (the CA bundle lives in another namespace,
    # so the chain is not verified here); 200 = unsealed and active
    http_openbao_health:
      prober: http
      timeout: 10s
      http:
        method: GET
        valid_status_codes: [200]
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        no_follow_redirects: true
        preferred_ip_protocol: ip4
        tls_config:
          insecure_skip_verify: true
    # the LAN resolver: a normal name answers; the canary name is blocked (0.0.0.0)
    dns_blocky:
      prober: dns
      timeout: 5s
      dns:
        transport_protocol: udp
        preferred_ip_protocol: ip4
        query_name: example.com
        query_type: A
        valid_rcodes: [NOERROR]
        validate_answer_rrs:
          fail_if_none_matches_regexp: [".+"]
    dns_blocky_blocked:
      prober: dns
      timeout: 5s
      dns:
        transport_protocol: udp
        preferred_ip_protocol: ip4
        query_name: blocky-canary.chill-town.de
        query_type: A
        valid_rcodes: [NOERROR]
        validate_answer_rrs:
          fail_if_not_matches_regexp: ['0\.0\.0\.0$']
    # the public upstreams over DNS-over-TLS (certificate name verified)
    dns_dot_cloudflare:
      prober: dns
      timeout: 5s
      dns:
        transport_protocol: tcp
        dns_over_tls: true
        preferred_ip_protocol: ip4
        query_name: example.com
        query_type: A
        valid_rcodes: [NOERROR]
        validate_answer_rrs:
          fail_if_none_matches_regexp: [".+"]
        tls_config:
          server_name: cloudflare-dns.com
          insecure_skip_verify: false
    dns_dot_quad9:
      prober: dns
      timeout: 5s
      dns:
        transport_protocol: tcp
        dns_over_tls: true
        preferred_ip_protocol: ip4
        query_name: example.com
        query_type: A
        valid_rcodes: [NOERROR]
        validate_answer_rrs:
          fail_if_none_matches_regexp: [".+"]
        tls_config:
          server_name: dns.quad9.net
          insecure_skip_verify: false
serviceMonitor:
  selfMonitor:
    enabled: true
