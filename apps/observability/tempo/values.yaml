# Tempo, single binary on the local filesystem (chart grafana-community/tempo, pinned in the Application).
# 7 days of block retention.
tempo:
  tag: "3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044"
  retention: 168h
  reportingEnabled: false
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 512Mi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
nodeSelector:
  kubernetes.io/hostname: k3s-agent-1
persistence:
  enabled: true
  size: 5Gi
  storageClassName: local-path
serviceMonitor:
  enabled: true
