# Ingress to every pod of `monitoring`: from pods of `monitoring`; from the gateway to Grafana (3000); from cluster
# endpoints to the Alloy OTLP ports (4317, 4318). Everything else is dropped; egress stays open (scrapes, probes, Discord) except
# for the SNMP exporter and Prometheus, which have their own egress policies below.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-ingress
  namespace: monitoring
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
            - port: "4318"
              protocol: TCP
---
# The SNMP exporter reaches only the NAS (UDP 161); it needs no DNS (the target is an address). Ingress stays with
# `monitoring-ingress`.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: snmp-exporter
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus-snmp-exporter
  egress:
    - toCIDR:
        - 192.168.1.117/32
      toPorts:
        - ports:
            - port: "161"
              protocol: UDP
---
# Prometheus reaches the cluster (all scrape targets, service discovery, Alertmanager, DNS), the API server and the Home
# Assistant metrics port; nothing else. A selected egress policy turns on default-deny for this pod only. The one ingress rule lets the
# API server's service proxy read the Prometheus (TCP 9090 only). The proxied request arrives from the host of the control-plane node, which
# Cilium labels `remote-node` (the `kube-apiserver` entity does not match it here); the other node hosts are the cluster's own machines.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  ingress:
    - fromEntities:
        - remote-node
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
  egress:
    - toEntities:
        - cluster
        - kube-apiserver
    - toCIDR:
        - 192.168.1.30/32
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
---
# Prometheus also reads the host exporters outside the cluster (TCP 9100, the addresses of the scrape config `hosts`). Cilium adds the allows of
# every policy that selects a pod, so the policy above stays as it is.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus-hosts
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  egress:
    - toCIDR:
        - 192.168.1.98/32
        - 192.168.1.248/32
        - 192.168.1.249/32
      toPorts:
        - ports:
            - port: "9100"
              protocol: TCP
