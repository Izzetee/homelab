# The two former bootstrap Secrets of the monitoring namespace, now kept by the store (`Orphan`: adopted in place, same uid, no owner
# reference, created when missing). `admin-user` is a literal, not a secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana-admin
    creationPolicy: Orphan
    template:
      engineVersion: v2
      data:
        admin-user: admin
        admin-password: "{{ .adminPassword }}"
  data:
    - secretKey: adminPassword
      remoteRef:
        key: monitoring/grafana-admin
        property: admin-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-receiver
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: alertmanager-receiver
    creationPolicy: Orphan
  data:
    - secretKey: webhook-url
      remoteRef:
        key: monitoring/alertmanager-receiver
        property: webhook-url
