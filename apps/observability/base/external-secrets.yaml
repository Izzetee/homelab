# The two former bootstrap Secrets of the monitoring namespace, now kept by the store (`Orphan`: adopted in place, same uid, no owner
# reference, created when missing). The operator copies the annotations below to the Secret, so Argo CD neither counts the Secret
# as out of sync nor ever prunes it. `admin-user` is a literal, not a secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana-admin
    creationPolicy: Orphan
    template:
      engineVersion: v2
      data:
        admin-user: admin
        admin-password: "{{ .adminPassword }}"
  data:
    - secretKey: adminPassword
      remoteRef:
        key: monitoring/grafana-admin
        property: admin-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-receiver
  namespace: monitoring
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: alertmanager-receiver
    creationPolicy: Orphan
  data:
    - secretKey: webhook-url
      remoteRef:
        key: monitoring/alertmanager-receiver
        property: webhook-url
---
# The client secret of Grafana's sign-in through the identity provider (env var of the Grafana pod, see the chart values).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: monitoring
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana-oidc
    creationPolicy: Orphan
  data:
    - secretKey: grafana
      remoteRef:
        key: authentik/oidc-clients
        property: grafana
---
# SNMPv3 user and passwords of the NAS, read by the SNMP exporter as environment variables (the exporter's config holds only
# markers). The keys keep their variable names.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nas-snmp
  namespace: monitoring
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: nas-snmp
    creationPolicy: Orphan
  data:
    - secretKey: NAS_SNMP_USER
      remoteRef:
        key: monitoring/nas-snmp
        property: NAS_SNMP_USER
    - secretKey: NAS_SNMP_AUTH_PASSWORD
      remoteRef:
        key: monitoring/nas-snmp
        property: NAS_SNMP_AUTH_PASSWORD
    - secretKey: NAS_SNMP_PRIV_PASSWORD
      remoteRef:
        key: monitoring/nas-snmp
        property: NAS_SNMP_PRIV_PASSWORD
---
# The bearer token Prometheus presents to the Home Assistant metrics endpoint (referenced by the ScrapeConfig `home-assistant`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-token
  namespace: monitoring
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: home-assistant-token
    creationPolicy: Orphan
  data:
    - secretKey: token
      remoteRef:
        key: monitoring/home-assistant
        property: token
