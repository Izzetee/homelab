# Loki, single binary on the local filesystem (chart grafana-community/loki, pinned in the Application).
# One tenant, reachable only inside the monitoring namespace; 14 days of retention.
deploymentMode: Monolithic
loki:
  auth_enabled: false
  image:
    tag: "3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28"
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    retention_period: 336h
    allow_structured_metadata: true
    volume_enabled: true
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem
    compaction_interval: 10m
    retention_delete_delay: 2h
  pattern_ingester:
    enabled: false
singleBinary:
  replicas: 1
  nodeSelector:
    kubernetes.io/hostname: k3s-agent-1
  persistence:
    enabled: true
    size: 20Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 1Gi
  podDisruptionBudget:
    enabled: false
# the rules sidecar would need read access to Secrets; there is no ruler
sidecar:
  rules:
    enabled: false
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
monitoring:
  serviceMonitor:
    enabled: true
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
